<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Orbit" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>Orbit</title>
<style>
  :root{
    --bg:#000; --panel:#1C1C1E; --panel2:#2C2C2E;
    --line:rgba(255,255,255,0.10); --line2:rgba(255,255,255,0.16);
    --txt:#fff; --txt2:rgba(255,255,255,0.55); --txt3:rgba(255,255,255,0.35);
    --close:#FF9F0A; --friend:#30D158; --family:#FF453A; --colleague:#0A84FF; --place:#BF5AF2;
    --amber:#FFD60A; --red:#FF453A; --green:#30D158;
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);}
  body{
    font-family:var(--sf);color:var(--txt);position:fixed;inset:0;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-font-smoothing:antialiased;
  }
  #map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;}

  /* ---------- top bar ---------- */
  #topbar{position:absolute;left:0;right:0;top:0;z-index:20;
    padding:calc(var(--safe-t) + 12px) 16px 10px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    background:linear-gradient(180deg,rgba(0,0,0,0.72),rgba(0,0,0,0));
    pointer-events:none;}
  #topbar > *{pointer-events:auto;}
  .title{font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1;}
  .sub{font-size:12px;color:var(--txt2);margin-top:4px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .sub .od{color:var(--red);font-weight:600;}
  .topbtns{display:flex;gap:8px;align-items:center;}
  .icobtn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.08);border:0.5px solid var(--line2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;font-size:17px;cursor:pointer;transition:transform .15s;}
  .icobtn:active{transform:scale(0.9);}
  .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #000;}

  /* ---------- controls bottom-right ---------- */
  #controls{position:absolute;right:16px;bottom:calc(var(--safe-b) + 18px);z-index:20;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .ctl{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.09);border:0.5px solid var(--line2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;font-size:19px;cursor:pointer;transition:transform .15s;}
  .ctl:active{transform:scale(0.9);}
  #fab{width:58px;height:58px;border-radius:50%;background:#fff;color:#000;font-size:30px;font-weight:300;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 28px rgba(255,255,255,0.18);transition:transform .15s;}
  #fab:active{transform:scale(0.9);}

  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 26px);z-index:15;
    font-size:12px;color:var(--txt3);background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:20px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none;transition:opacity .6s;}

  /* ---------- scrim + sheet ---------- */
  #scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  #scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0 auto;max-width:500px;
    background:var(--panel);border-top-left-radius:26px;border-top-right-radius:26px;
    border:0.5px solid var(--line);box-shadow:0 -12px 50px rgba(0,0,0,0.6);
    padding:10px 20px calc(var(--safe-b) + 40px);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    transform:translateY(110%);transition:transform .38s cubic-bezier(.22,1,.36,1);-webkit-overflow-scrolling:touch;}
  .sheet.on{transform:translateY(0);}
  .sheet-top{position:sticky;top:0;z-index:5;background:var(--panel);margin:0 -20px 6px;padding:10px 20px 8px;display:flex;align-items:center;justify-content:center;}
  .sheet-x{position:absolute;right:16px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .sheet-x:active{transform:scale(0.9);}
  .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,0.25);}
  .sh-title{font-size:23px;font-weight:800;letter-spacing:-0.02em;}
  .sh-sub{font-size:13px;color:var(--txt2);margin-top:3px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}

  label.fl{font-size:11px;font-weight:700;color:var(--txt2);letter-spacing:0.07em;text-transform:uppercase;display:block;margin:16px 0 7px;}
  input,select,textarea{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid var(--line2);color:#fff;
    font-size:15px;font-family:inherit;padding:12px 13px;border-radius:12px;outline:none;-webkit-appearance:none;appearance:none;}
  textarea{resize:none;min-height:64px;}
  input::placeholder,textarea::placeholder{color:var(--txt3);}
  input[type="date"]{color-scheme:dark;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='white' stroke-opacity='0.5' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
  input[type="range"]{-webkit-appearance:none;background:transparent;padding:0;height:26px;}
  input[type="range"]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(255,255,255,0.14);}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9.5px;box-shadow:0 2px 8px rgba(0,0,0,.5);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{flex:1 1 auto;text-align:center;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,0.06);border:0.5px solid var(--line2);color:var(--txt2);transition:transform .12s;white-space:nowrap;}
  .chip:active{transform:scale(.96);}
  .chip.on{color:#fff;}
  .chip.act{color:#fff;font-weight:600;}
  .chip.sel{background:rgba(255,255,255,0.16);color:#fff;}
  body.sparkle .chip.sel{background:linear-gradient(135deg,#FF7EB3,#FF4D9D);border-color:#FF4D9D;color:#fff;}
  body.sparkle .chip.act{color:#A8446E;}

  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
    transition:transform .14s;margin-top:10px;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:#fff;color:#000;}
  .btn.ghost{background:rgba(255,255,255,0.08);color:#fff;border:0.5px solid var(--line2);}
  .btn.danger{background:transparent;color:var(--red);font-weight:600;font-size:13px;padding:10px;}
  .btn.green{background:var(--green);color:#00330f;}
  .btn.disabled{opacity:.4;pointer-events:none;}

  .social-in{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.06);border:0.5px solid var(--line2);border-radius:12px;padding:0 12px;margin-bottom:8px;}
  .social-in span.i{color:var(--txt2);font-size:13px;width:20px;text-align:center;}
  .social-in input{border:none;background:transparent;padding:12px 0;border-radius:0;}

  .meter{display:flex;gap:4px;margin-top:8px;}
  .meter i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.08);}
  .photoPrev{width:54px;height:54px;border-radius:50%;flex-shrink:0;background:#2C2C2E center/cover no-repeat;border:0.5px solid var(--line2);cursor:pointer;}

  .link-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border:0.5px solid var(--line);
    border-radius:12px;padding:12px 13px;margin-bottom:8px;text-decoration:none;color:#fff;font-size:14px;}
  .link-row .i{width:22px;text-align:center;color:var(--txt2);}
  .link-row .arr{margin-left:auto;color:var(--txt3);}

  .rem-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:0.5px solid var(--line);cursor:pointer;}
  .rem-item:last-child{border-bottom:none;}
  .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .rem-item .nm{font-size:15px;font-weight:600;}
  .rem-item .ds{font-size:12px;color:var(--txt2);margin-top:1px;}
  .rem-item .go{margin-left:auto;color:var(--txt3);}
  .seg-title{font-size:12px;font-weight:700;color:var(--txt3);letter-spacing:0.06em;text-transform:uppercase;margin:18px 0 4px;}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--safe-b) + 90px);z-index:70;
    background:rgba(40,40,42,0.96);border:0.5px solid var(--line2);color:#fff;font-size:14px;font-weight:600;
    padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;backdrop-filter:blur(20px);}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- onboarding / loader ---------- */
  #boot,#auth{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:32px;text-align:center;overflow-y:auto;}
  #auth{z-index:91;}
  #boot img,#auth img{width:96px;height:96px;border-radius:24px;margin-bottom:26px;box-shadow:0 12px 50px rgba(120,175,255,0.25);}
  #auth img{width:76px;height:76px;margin-bottom:18px;}
  #boot h1,#auth h1{font-size:44px;font-weight:800;letter-spacing:-0.03em;margin:0 0 10px;}
  #auth h1{font-size:36px;}
  #boot p,#auth p{font-size:15px;color:var(--txt2);margin:0 0 32px;max-width:300px;line-height:1.45;}
  #auth p{margin-bottom:20px;}
  #boot .field,#auth .field{width:100%;max-width:320px;text-align:left;}
  #boot input,#auth input{font-size:16px;padding:14px;}
  #boot .btn,#auth .btn{max-width:320px;}
  .fade-in{animation:fadeIn .5s cubic-bezier(.22,1,.36,1);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- list view ---------- */
  #listview{position:absolute;left:0;right:0;top:0;bottom:0;z-index:16;background:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(var(--safe-t) + 92px) 16px calc(var(--safe-b) + 90px);}
  .lv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;}
  .seg{display:flex;background:rgba(255,255,255,0.08);border:0.5px solid var(--line2);border-radius:11px;padding:3px;}
  .segbtn{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt2);cursor:pointer;transition:transform .12s;}
  .segbtn:active{transform:scale(.96);}
  .segbtn.on{background:rgba(255,255,255,0.16);color:#fff;}
  .lv-summary{font-size:12px;color:var(--txt2);padding:2px 2px 12px;line-height:1.5;}
  .lv-msg{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#0A84FF;text-decoration:none;}
  #lvBody .rem-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #lvBody .rem-item .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  body.listmode #btnFit,body.listmode #btnZoomIn,body.listmode #btnZoomOut,body.listmode #hint{display:none !important;}

  /* ---------- birthday wheel ---------- */
  #bwheel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:17;background:#000;overflow-y:auto;
    padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;align-items:center;}
  .bw-head{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  #bwWrap{width:100%;max-width:440px;}
  #bwWrap svg{width:100%;height:auto;display:block;}
  #bwInfo{width:100%;max-width:460px;margin-top:6px;}
  #bwInfo .bw-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:0.5px solid var(--line);cursor:pointer;}
  #bwInfo .bw-row:last-child{border-bottom:none;}

  /* ================= SPARKLE THEME ================= */
  body.sparkle{
    --bg:#FFEBF4; --panel:#FFFFFF; --panel2:#FFEEF6;
    --line:rgba(214,110,160,0.16); --line2:rgba(214,110,160,0.26);
    --txt:#4A2A3C; --txt2:rgba(74,42,60,0.62); --txt3:rgba(74,42,60,0.40);
    --close:#FF7EB3; --friend:#57D2B4; --family:#FF6F91; --colleague:#8FA9FF; --special:#FF2E93;
    --place:#C77DFF; --amber:#F2B23C; --red:#FF5C86; --green:#3FC9A6;
    color:var(--txt);
  }
  body.sparkle,html:has(body.sparkle){background:#FFEBF4;}
  body.sparkle .title{
    font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
    font-size:34px;font-weight:700;letter-spacing:0;
    background:linear-gradient(100deg,#FF4D9D,#C77DFF 55%,#F2B23C);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    padding-right:6px;line-height:1.15;
  }
  body.sparkle #topbar{background:linear-gradient(180deg,rgba(255,225,240,0.94),rgba(255,225,240,0));}
  body.sparkle .icobtn,body.sparkle .ctl{
    background:rgba(255,255,255,0.85);border:0.5px solid var(--line2);color:#B03A6E;
    box-shadow:0 3px 14px rgba(214,110,160,0.18);
  }
  body.sparkle .badge{border-color:#FFF5F9;}
  body.sparkle #fab{
    background:linear-gradient(140deg,#FF7EB3,#FF4D9D 60%,#C77DFF);color:#fff;
    box-shadow:0 8px 26px rgba(255,77,157,0.42);
  }
  body.sparkle #hint{background:rgba(255,255,255,0.72);color:var(--txt3);}
  body.sparkle #scrim{background:rgba(120,60,90,0.30);}
  body.sparkle .sheet{
    background:linear-gradient(180deg,#FFFFFF,#FFF4FA);
    border:0.5px solid var(--line2);box-shadow:0 -14px 50px rgba(180,90,130,0.22);
  }
  body.sparkle .sheet-top{background:#FFFFFF;}
  body.sparkle .sheet-x{background:rgba(214,110,160,0.12);color:#B03A6E;}
  body.sparkle .grab{background:rgba(214,110,160,0.30);}
  body.sparkle .sh-title{
    font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
    font-size:30px;color:#B03A6E;
  }
  body.sparkle input,body.sparkle select,body.sparkle textarea{
    background-color:#FFF7FB;border:1px solid var(--line2);color:var(--txt);
  }
  body.sparkle input,body.sparkle textarea{background-image:none;}
  body.sparkle input::placeholder,body.sparkle textarea::placeholder{color:var(--txt3);}
  body.sparkle input[type="date"]{color-scheme:light;}
  body.sparkle select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23B03A6E' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;background-size:12px 8px;
  }
  body.sparkle input[type="range"]::-webkit-slider-runnable-track{background:rgba(214,110,160,0.22);}
  body.sparkle input[type="range"]::-webkit-slider-thumb{background:#fff;box-shadow:0 2px 8px rgba(214,110,160,0.5);}
  body.sparkle .chip{background-color:#FFF1F7;background-image:none;border:1px solid var(--line2);color:#8A5470;}
  body.sparkle .btn.primary{background:linear-gradient(135deg,#FF7EB3,#FF4D9D);color:#fff;box-shadow:0 6px 18px rgba(255,77,157,0.32);}
  body.sparkle .btn.ghost{background-color:#FFF1F7;background-image:none;color:#8A5470;border:1px solid var(--line2);}
  body.sparkle .btn.green{background:linear-gradient(135deg,#6FE0C2,#3FC9A6);color:#06463A;}
  body.sparkle .btn.danger{color:#E23A6B;}
  body.sparkle label.fl{color:#B8779A;letter-spacing:0.10em;}
  body.sparkle .social-in{background-color:#FFF7FB;border:1px solid var(--line2);}
  body.sparkle .link-row{background-color:#FFF7FB;border:1px solid var(--line);color:var(--txt);}
  body.sparkle .meter i{background:rgba(214,110,160,0.16);}
  body.sparkle .photoPrev{background-color:#FFF0F6;border:1px solid var(--line2);}
  body.sparkle .rem-item{border-bottom:1px solid var(--line);}
  body.sparkle .seg{background-color:#FFF1F7;border:1px solid var(--line2);}
  body.sparkle .segbtn.on{background:#fff;color:#B03A6E;box-shadow:0 2px 8px rgba(214,110,160,0.2);}
  body.sparkle #listview,body.sparkle #bwheel{background:linear-gradient(180deg,#FFF3F9,#FFE2EF);}
  body.sparkle #toast{background:rgba(255,255,255,0.97);color:#7A3E5C;border:1px solid var(--line2);box-shadow:0 8px 26px rgba(180,90,130,0.25);}
  body.sparkle #boot,body.sparkle #auth{background:radial-gradient(circle at 50% 20%,#FFFFFF,#FFD9EC 62%,#FFC2DF);}
  body.sparkle #boot h1,body.sparkle #auth h1{
    font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
    background:linear-gradient(100deg,#FF4D9D,#C77DFF 60%,#F2B23C);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  body.sparkle #boot p,body.sparkle #auth p{color:var(--txt2);}
  body.sparkle .lv-summary,body.sparkle #lvBody .rem-item .ds{color:var(--txt2);}

  /* ---------- guided tour ---------- */
  #tour{position:fixed;inset:0;z-index:80;pointer-events:none;}
  #tourRing{position:absolute;border-radius:18px;border:2.5px solid #FFD60A;
    box-shadow:0 0 0 9999px rgba(0,0,0,0.55),0 0 22px rgba(255,214,10,0.75);
    transition:all .35s cubic-bezier(.22,1,.36,1);opacity:0;}
  #tourRing.on{opacity:1;}
  body.sparkle #tourRing{border-color:#FF4D9D;box-shadow:0 0 0 9999px rgba(120,60,90,0.42),0 0 22px rgba(255,77,157,0.7);}
  #tourCard{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 22px);
    width:min(430px,calc(100% - 28px));pointer-events:auto;
    background:var(--panel);border:0.5px solid var(--line2);border-radius:22px;
    padding:18px 18px 16px;box-shadow:0 18px 60px rgba(0,0,0,0.6);}
  body.sparkle #tourCard{box-shadow:0 18px 60px rgba(180,90,130,0.30);background:linear-gradient(180deg,#FFFFFF,#FFF4FA);}
  #tourCard.top{bottom:auto;top:calc(var(--safe-t) + 84px);}
  #tourStep{font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--txt3);}
  #tourTitle{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin:4px 0 6px;}
  body.sparkle #tourTitle{font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;font-size:27px;color:#B03A6E;}
  #tourBody{font-size:14px;line-height:1.5;color:var(--txt2);margin-bottom:14px;}
  .trow{display:flex;gap:10px;align-items:center;}

  .hidden{display:none !important;}
</style>
</head>
<body>
  <canvas id="map"></canvas>

  <div id="listview" class="hidden">
    <div class="lv-head">
      <div class="seg">
        <div class="segbtn on" id="sortUrg">Urgency</div>
        <div class="segbtn" id="sortAZ">A&ndash;Z</div>
      </div>
      <div class="icobtn" id="aiPlanBtn" title="AI outreach plan">&#10024;</div>
    </div>
    <div id="lvBody"></div>
  </div>

  <div id="bwheel" class="hidden">
    <div class="bw-head">
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em">Birthdays</div>
      <div class="icobtn" id="bwClose" title="Close">&#10005;</div>
    </div>
    <div id="bwWrap"></div>
    <div id="bwInfo"></div>
  </div>

  <div id="topbar" class="hidden">
    <div>
      <div class="title">Orbit</div>

const KEY = "orbit.state.v3";
let state = { userName:null, nodes:[], cam:null, tombstones:{}, filters:{}, animations:true,
              colorMode:"cluster", hulls:true, decay:true, geo:false, theme:"midnight", sparkleFx:true, demo:false };
let ME = { id:"me", type:"me", name:"Me", parentId:null, x:0, y:0, vx:0, vy:0 };

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(!raw){
      // migrate from any older orbit.state.vN key so future versions never lose data
      const keys = Object.keys(localStorage).filter(k=>/^orbit\.state\.v/.test(k)).sort();
      if(keys.length) raw = localStorage.getItem(keys[keys.length-1]);
    }
    if(raw){
      const s = JSON.parse(raw);
      state.userName = s.userName ?? null;
      state.nodes = Array.isArray(s.nodes) ? s.nodes : [];
      state.cam = s.cam || null;
      state.tombstones = (s.tombstones && typeof s.tombstones==="object") ? s.tombstones : {};
      state.filters = (s.filters && typeof s.filters==="object") ? s.filters : {};
      state.animations = s.animations!==false;
      state.colorMode = s.colorMode==="category" ? "category" : "cluster";
      state.hulls = s.hulls!==false; state.decay = s.decay!==false; state.geo = s.geo===true;
      state.theme = s.theme==="sparkle" ? "sparkle" : "midnight";
      state.sparkleFx = s.sparkleFx!==false;
      if(s.me){ ME = Object.assign(ME, s.me); }
    }
  }catch(e){}
}
let saveTimer=null;
function save(){
  cloudDirty=true;
  clearTimeout(saveTimer);
  if(state.demo) return;                 // don't persist the sample network either
  saveTimer = setTimeout(()=>{
    captureFreeLayout();   // keep the hand-organised layout up to date (skipped in world-map mode)
    try{
      localStorage.setItem(KEY, JSON.stringify({
        userName: state.userName, nodes: plainNodes(),
        me:{x:ME.x,y:ME.y,name:ME.name,photo:ME.photo||"",color:ME.color||""},
        cam:{x:cam.x,y:cam.y,scale:cam.scale},
        tombstones: state.tombstones, filters: state.filters, animations: state.animations,
        colorMode: state.colorMode, hulls: state.hulls, decay: state.decay, geo: state.geo, theme: state.theme, sparkleFx: state.sparkleFx
      }));
      localStorage.setItem("orbit.lastlocal", String(Date.now()));
    }catch(e){}
    syncSoon();
  },250);
}

function hslHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);

  const to=v=>Math.round(255*v).toString(16).padStart(2,"0");
  return "#"+to(f(0))+to(f(8))+to(f(4));
}

/* structure: children + descendant counts + radius, recomputed on mutation */
function rebuild(){
  const all = allNodes();
  const map = {};
  all.forEach(n=>{ n._kids=[]; map[n.id]=n; });
  all.forEach(n=>{ if(n.parentId!=null && map[n.parentId]) map[n.parentId]._kids.push(n); });
  // descendant count via DFS
  function desc(n){ let c=0; for(const k of n._kids){ c += 1 + desc(k); } n._desc=c; return c; }
  desc(ME);
  // radius by subtree weight: hubs scale with how many people hang off them,
  // the core grows slowly as the network grows, and a child is always < its parent.
  ME._r = baseR(ME);
  (function assign(n){ for(const k of n._kids){
    k._r = Math.max(6, Math.min(baseR(k)*sizeFactor(k), n._r*0.86));
    assign(k);
  } })(ME);
  // visibility (category / type filters), inherited from ancestors
  ME._vis = true;
  (function vis(n){ for(const k of n._kids){ k._vis = n._vis && ownVisible(k); vis(k); } })(ME);
  // cluster identity: each top-level branch gets a hue, inherited by its whole subtree

/* ---- world-map mode: move everyone, not just the pins ---- */

// 1 = recently in touch, 0 = long gone. Uses cadence when set, else a 180-day yardstick.
function freshness(n){

}
// weight = size of the whole subtree; sqrt keeps it in proportion. More attached ⇒ bigger.
function baseR(n){ const w = 1 + (n._desc||0); return 6 + 14*Math.sqrt(w); }

/* dates */
function parseYMD(s){ if(!s) return null; const p=s.split("-").map(Number); if(p.length!==3||!p[0]) return null; return {y:p[0],m:p[1],d:p[2]}; }

/* contact cadence status: returns {frac, left, color, state} */

  if(n.type!=="person" || !n.cadenceDays || !n.lastContact) return null;
  const el = (Date.now()-n.lastContact)/DAY;

/* ============================================================
   CANVAS + CAMERA
============================================================ */
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
let cam = { x:0, y:0, scale:1 };

const toScreenX = wx => (wx - cam.x)*cam.scale + W/2;

/* ============================================================
   FORCE SIMULATION
============================================================ */
let simAlpha = 0;
const SIM_MIN = 0.008;

function stepSim(){
  const full = allNodes();

  for(const p of full){
    if(p.x==null||p.y==null){
      const par = byId(p.parentId) || ME;
      const ang = Math.random()*Math.PI*2;
      p.x = (par.x||0) + Math.cos(ang)*((par._r||40)+(p._r||18)+50);
      p.y = (par.y||0) + Math.sin(ang)*((par._r||40)+(p._r||18)+50);
      p.vx=0; p.vy=0;
    }
  }
  const all = full.filter(p=>p._vis!==false);   // hidden (filtered) nodes don't affect layout
  const n = all.length;
  // repulsion scaled by node size so big hubs claim their space (de-cramps the web)
  for(let i=0;i<n;i++){
    const a=all[i];
    for(let j=i+1;j<n;j++){
      const b=all[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy; if(d2<0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d2=1; }
      const d=Math.sqrt(d2);
      const sum=a._r+b._r;
      const rep = (sum*sum*0.9 + 1400) / d2;
      const fx=(dx/d)*rep, fy=(dy/d)*rep;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }

  // link springs (parent<->child)
  for(const c of all){
    if(c.parentId==null) continue;
    const p=byId(c.parentId); if(!p||p._vis===false) continue;
    let dx=c.x-p.x, dy=c.y-p.y; let d=Math.hypot(dx,dy)||0.01;
    let rest = p._r + c._r + 46 + (isContainerType(c.type) ? 34 + Math.sqrt(c._desc||0)*34 : Math.sqrt(c._desc||0)*22);
    // direct branches off you get a generous ring so the first view never looks cramped
    if(c.parentId==="me") rest = Math.max(rest, 250 + Math.sqrt(c._desc||0)*34);
    const f = (d-rest)*0.04;
    const fx=(dx/d)*f, fy=(dy/d)*f;
    c.vx-=fx; c.vy-=fy; p.vx+=fx; p.vy+=fy;
  }
  // collision (hard anti-overlap, padded by size)
  for(let i=0;i<n;i++){
    const a=all[i];
    for(let j=i+1;j<n;j++){
      const b=all[j];
      const dx=a.x-b.x, dy=a.y-b.y; const d=Math.hypot(dx,dy)||0.01;
      const min=a._r+b._r+14;

    }
  }

    if(p===ME){

        const gs=all.filter(q=>isContainerType(q.type)&&geoOf(q));
        if(gs.length){ let tx=0,ty=0; gs.forEach(q=>{const g=geoOf(q); tx+=g[0]*GEO_SCALE; ty+=-g[1]*GEO_SCALE*1.25;});
          tx/=gs.length; ty/=gs.length; p.x+=(tx-p.x)*0.08; p.y+=(ty-p.y)*0.08; }

  }
}

/* ============================================================
   RENDER
============================================================ */
let rafId=null, interacting=false, selectedId=null, focusPulse=0;
function ensureLoop(){ if(rafId==null) rafId=requestAnimationFrame(frame); }
function requestFrame(){ ensureLoop(); }
let animTime=0;
function animOff(n){
  if(!state.animations || n.type==="me" || n._drag || n.pinned) return NO_OFF;

const NO_OFF=[0,0];
let lastPaint=0;
function frame(){

  if(focusPulse>0){ focusPulse-=0.04; active=true; }
  // when nothing is happening but idle motion is on, paint at ~30fps to save battery

  if(!idleOnly || animTime-lastPaint>32){ lastPaint=animTime; render(); }
  if(active||interacting||state.animations) ensureLoop();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // subtle vignette background
  const g=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,TH().bg0); g.addColorStop(1,TH().bg1);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const all = allNodes();
  labelBoxes.length=0;
  if(sparkleCount()) drawSparkles();
  if(state.geo) drawGraticule();
  // ---- cluster membranes (soft territory behind each top-level branch) ----
  if(state.hulls) drawHulls(all);
  // ---- links (curved, thickness by closeness, faded by decay) ----
  for(const c of all){
    if(c.parentId==null || c._vis===false) continue;
    const p=byId(c.parentId); if(!p||p.x==null||c.x==null||p._vis===false) continue;
    const ax=toScreenX(p.x+animOff(p)[0]), ay=toScreenY(p.y+animOff(p)[1]);
    const bx=toScreenX(c.x+animOff(c)[0]), by=toScreenY(c.y+animOff(c)[1]);
    const w = c.type==="person" ? (0.5+((c.closeness||5)/10)*1.9) : 1.7;
    ctx.lineWidth = Math.max(0.5, w*cam.scale);
    const fade = state.decay ? (0.10+0.26*(c._fresh==null?1:c._fresh)) : 0.26;
    ctx.strokeStyle = hexA(nodeColor(c), fade*dimFactor(c));
    // gentle arc between parent and child

    const cxp=mx-dy*0.09, cyp=my+dx*0.09;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(cxp,cyp,bx,by); ctx.stroke();
  }
  // introduced-by (dashed)
  ctx.setLineDash([2,5]);
  ctx.strokeStyle=hexA(TH().label.charAt(0)==="#"?TH().label:"#ffffff",0.22);
  for(const c of state.nodes){
    if(!c.introducedById || c._vis===false) continue;
    const p=byId(c.introducedById); if(!p||p.x==null||p._vis===false) continue;
    ctx.beginPath(); ctx.moveTo(toScreenX(p.x),toScreenY(p.y)); ctx.lineTo(toScreenX(c.x),toScreenY(c.y)); ctx.stroke();
  }
  ctx.setLineDash([]);

  // ---- nodes (largest first, so big hubs win the label space) ----
  const drawList=all.filter(n=>n.x!=null && n._vis!==false).sort((a,b)=>(b._r||0)-(a._r||0));
  for(const nnode of drawList) drawNode(nnode);
}
function hexA(hex,a){
  const h=hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
/* ---- sparkle theme: drifting four-point stars in the background ---- */
let sparkleField=null;
/* the pink glow is expensive to paint, so bake it once into an offscreen canvas */
let bloomCache=null, bloomKey="";
function drawBloom(){
  const key=W+"x"+H+"|"+state.theme;
  if(bloomKey!==key || !bloomCache){
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(W)); c.height=Math.max(1,Math.round(H));
    const g2=c.getContext("2d");
    [[0.18,0.22,"#FF9ECB"],[0.82,0.30,"#E0A6FF"],[0.30,0.82,"#FFC2DC"],[0.72,0.76,"#FFD9A8"]].forEach(b=>{
      const bx=b[0]*W, by=b[1]*H, rr=Math.max(W,H)*0.45;
      const g=g2.createRadialGradient(bx,by,0,bx,by,rr);
      g.addColorStop(0,hexA(b[2],0.32)); g.addColorStop(1,hexA(b[2],0));
      g2.fillStyle=g; g2.fillRect(0,0,c.width,c.height);

  }

}
function sparkleCount(){ return state.sparkleFx===false ? 0 : TH().sparkles; }
function drawSparkles(){
  const n=sparkleCount(); if(!n) return;
  if(!sparkleField || sparkleField.length!==n){
    sparkleField=[]; let seed=7;
    const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
    for(let i=0;i<n;i++) sparkleField.push({x:rnd(),y:rnd(),s:0.7+rnd()*2.3,ph:rnd()*6.28,sp:0.25+rnd()*0.8,
      kind: rnd()>0.72 ? "gold" : (rnd()>0.30 ? "pink" : "white")});
  }
  if(TH().bloom) drawBloom();
  const t=state.animations? animTime*0.00045 : 0;
  ctx.save();
  for(const p of sparkleField){
    const x=((p.x + t*0.012*p.sp)%1)*W;
    const y=((p.y + t*0.020*p.sp)%1)*H;
    const tw=state.animations? (0.40+0.60*Math.abs(Math.sin(t*1.7+p.ph))) : 0.75;
    const r=p.s*(2.0+cam.scale*0.55);

    const warm = state.theme==="sparkle";
    ctx.fillStyle = p.kind==="gold" ? (warm?"#F5C451":"#FFE9A8")

    ctx.quadraticCurveTo(x-r*0.35,y+r*0.35, x-r*2.1,y);
    ctx.quadraticCurveTo(x-r*0.35,y-r*0.35, x,y-r*2.1);

  }

}
/* ---- glossy highlight so bubbles read like pearls in the sparkle theme ---- */
function drawGloss(sx,sy,r){

  ctx.globalAlpha=a*0.30;

  ctx.beginPath(); ctx.ellipse(sx-r*0.26, sy-r*0.34, r*0.46, r*0.30, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha=a*0.55;

/* ---- geographic mode: latitude/longitude grid so it reads as a world map ---- */

    const x=toScreenX(lon*GEO_SCALE);

  }

/* ---- focus mode: when something is selected, its branch stays bright, rest dims ---- */

    ctx.moveTo((h[0][0]+h[h.length-1][0])/2,(h[0][1]+h[h.length-1][1])/2);
    for(let i=0;i<h.length;i++){
      const cur=h[i], nxt=h[(i+1)%h.length];
      ctx.quadraticCurveTo(cur[0],cur[1],(cur[0]+nxt[0])/2,(cur[1]+nxt[1])/2);

    const a=dimFactor(g[0]);

function drawNode(n){
  const off=animOff(n);

  if(sx< -r-80||sx>W+r+80||sy<-r-80||sy>H+r+80) return; // cull
  const col = nodeColor(n);
  const isMe = n.type==="me", isContainer = isContainerType(n.type);
  const im = getImg(n);
  const fresh = (state.decay && n.type==="person") ? (n._fresh==null?1:n._fresh) : 1;

    grad.addColorStop(1, isMe?(ME.color?ME.color:TH().me1):shade(col,-0.34));

    ctx.beginPath(); ctx.arc(bx,by,bd,0,Math.PI*2);

  }

  if(n.type==="person"){
    const cs=contactStatus(n);
    if(cs){
      const rr=r+4;
      ctx.lineWidth=Math.max(1.5,2.4*cam.scale);
      ctx.strokeStyle=hexA(cs.color,0.28);
      ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=cs.color;
      ctx.beginPath(); ctx.arc(sx,sy,rr,-Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(cs.frac,1)); ctx.stroke();

    }
  }
  /* ---- LOD: how much text to reveal, based on on-screen size ---- */
  const showName   = r>11 || isContainer || isMe;
  const showDetail = r>34 && !isMe;             // zoomed in enough for a mini card
  const labelRoom = labelFits(sx, sy+r+5, n, isMe||isContainer);
  if(showName && (labelRoom || isMe || n.id===selectedId)){
    const label = (isContainer||isMe) ? n.name : displayName(n);
    ctx.font=`${isContainer?"700":"600"} ${clamp(Math.round(11*Math.min(cam.scale,1.35)),10,16)}px ${FS}`;
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillStyle= n.type==="place"?"#E7D3FA": n.type==="event"?"#C7EEFA":"rgba(255,255,255,0.94)";
    ctx.shadowColor="rgba(0,0,0,0.9)"; ctx.shadowBlur=5;
    ctx.fillText(label, sx, sy+r+5);
    ctx.shadowBlur=0;
    if(showDetail){
      const lines=detailLines(n);
      ctx.font=`500 ${clamp(Math.round(9.5*Math.min(cam.scale,1.3)),9,13)}px ${FS}`;
      let yy=sy+r+5+clamp(Math.round(11*Math.min(cam.scale,1.35)),10,16)+3;
      ctx.shadowColor=TH().labelShadow; ctx.shadowBlur=4;
      for(const ln of lines){
        ctx.fillStyle=ln.c||TH().sub;
        ctx.fillText(ln.t, sx, yy); yy+=clamp(Math.round(11*Math.min(cam.scale,1.3)),10,14);

}
/* label de-collision: skip a label if it would sit on one already drawn.

const labelBoxes=[];
function labelFits(cx,cy,n,important){
  const w=Math.max(34,(n.name||"").length*5.4+8), h=13;
  const x0=cx-w/2, y0=cy, x1=cx+w/2, y1=cy+h;
  for(const b of labelBoxes){ if(x0<b[2]&&x1>b[0]&&y0<b[3]&&y1>b[1]) return false; }
  labelBoxes.push([x0,y0,x1,y1]);

}
/* first name, plus a surname initial when two people share a first name */
function displayName(n){
  const f=firstName(n.name);
  if(!ambiguousFirst.has(f.toLowerCase())) return f;
  const parts=(n.name||"").trim().split(/\s+/);
  return parts.length>1 ? f+" "+parts[parts.length-1][0].toUpperCase()+"." : f;
}
let ambiguousFirst=new Set();
function recomputeAmbiguous(){
  const seen={}; ambiguousFirst=new Set();
  state.nodes.forEach(n=>{ if(n.type!=="person") return; const f=firstName(n.name).toLowerCase(); if(!f) return;
    if(seen[f]) ambiguousFirst.add(f); else seen[f]=1; });
}
/* the mini card revealed when zoomed in */
function detailLines(n){
  const out=[];
  if(isContainerType(n.type)){
    const c=n._desc||0;
    out.push({t:(n.description||(n.type==="event"?"Event":"Place"))+" · "+c+(c===1?" person":" people")});
    return out;
  }
  const bits=[];
  if(n.role) bits.push(n.role);
  const city=cityOf(n); if(city) bits.push(city);
  if(bits.length) out.push({t:bits.join(" · ")});
  const cs=contactStatus(n);
  if(cs) out.push({t: cs.state==="overdue" ? (Math.abs(cs.left)+"d overdue") : (cs.left+"d to check in"), c:cs.color});
  else if(n.lastContact) out.push({t:"last "+elapsedDays(n.lastContact)+"d ago"});

    if(du!=null && du<=45) out.push({t: du===0?"🎂 today":"🎂 in "+du+"d", c:"#FF9F0A"}); }
  const s=n.socials||{}; const icons=Object.keys(SOCIAL_META).filter(k=>s[k]).map(k=>SOCIAL_META[k].i);
  if(icons.length) out.push({t:icons.join("  "), c:"rgba(255,255,255,0.45)"});

}
/* city inherited from the nearest place ancestor (free data — no typing) */
function cityOf(n){
  if(n.city) return n.city;
  let cur=byId(n.parentId), g=0;
  while(cur && g++<60){ if(cur.type==="place") return cur.name; cur=byId(cur.parentId); }
  return "";
}
const imgCache={};
function getImg(n){
  if(!n||!n.photo) return null;
  let im=imgCache[n.id];
  if(!im || im.__src!==n.photo){ im=new Image(); im.__src=n.photo; im.onload=()=>requestFrame(); im.src=n.photo; imgCache[n.id]=im; }
  return (im.complete && im.naturalWidth>0)? im : null;
}
function processImage(file, cb){
  if(!file){ cb(null); return; }
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{ const S=224; const c=document.createElement("canvas"); c.width=S; c.height=S;
      const g=c.getContext("2d"); const side=Math.min(img.width,img.height);
      const sx=(img.width-side)/2, sy=(img.height-side)/2;
      g.drawImage(img,sx,sy,side,side,0,0,S,S);
      try{ cb(c.toDataURL("image/jpeg",0.72)); }catch(e){ cb(null); } };
    img.onerror=()=>cb(null); img.src=rd.result; };
  rd.onerror=()=>cb(null);

function wirePhoto(get,set){
  const pf=document.getElementById("photoFile"), pb=document.getElementById("photoBtn"), pv=document.getElementById("photoPrev");
  if(!pf||!pb||!pv) return;
  const onFile=(file)=>processImage(file, durl=>{
    if(!durl){ toast("Couldn't read that image"); return; }

  });
  pb.onclick=()=>pf.click();
  pf.onchange=e=>onFile(e.target.files&&e.target.files[0]);

    el.addEventListener("dragover",e=>{ e.preventDefault(); el.style.outline="2px dashed rgba(120,175,255,0.8)"; el.style.outlineOffset="2px"; });
    el.addEventListener("dragleave",()=>{ el.style.outline=""; });
    el.addEventListener("drop",e=>{ e.preventDefault(); el.style.outline=""; const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f&&/^image\//.test(f.type||"")) onFile(f); else toast("Drop an image file"); });

function initials(name){ const p=(name||"").trim().split(/\s+/); return ((p[0]?.[0]||"")+(p[1]?.[0]||"")).toUpperCase()||"?"; }
function firstName(name){ return (name||"").trim().split(/\s+/)[0]||""; }

/* ============================================================
   HIT TESTING + GESTURES
============================================================ */
function nodeAt(sx,sy){
  const all=allNodes();
  for(let i=all.length-1;i>=0;i--){
    const n=all[i]; if(n.x==null || n._vis===false) continue;
    const dx=sx-toScreenX(n.x), dy=sy-toScreenY(n.y);
    if(dx*dx+dy*dy <= Math.pow(n._r*cam.scale+10,2)) return n;
  }
  return null;
}

let ptrs=new Map(); // active pointers
let gesture=null;   // {mode, ...}
let hadPinch=false, lastPinchEnd=0;
const TAP_MOVE=8, TAP_TIME=350;

function onDown(e){
  canvas.setPointerCapture?.(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:Date.now()});
  interacting=true; hideHint();
  if(ptrs.size===1){
    const hit=nodeAt(e.clientX,e.clientY);
    if(hit && hit.type!=="me"){
      gesture={mode:"node",node:hit,moved:false,x0:e.clientX,y0:e.clientY,t:Date.now()};
    }else if(hit && hit.type==="me"){
      gesture={mode:"maybeMe",node:hit,moved:false,x0:e.clientX,y0:e.clientY,t:Date.now()};
    }else{
      gesture={mode:"pan",moved:false,x0:e.clientX,y0:e.clientY,t:Date.now()};
    }
  }else if(ptrs.size===2){
    hadPinch=true;
    const p=[...ptrs.values()];
    gesture={mode:"pinch",d0:dist(p[0],p[1]),s0:cam.scale,
             mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,
             wx:toWorldX((p[0].x+p[1].x)/2),wy:toWorldY((p[0].y+p[1].y)/2)};
  }
  ensureLoop();
}
function onMove(e){
  const rec=ptrs.get(e.pointerId); if(!rec) return;
  rec.x=e.clientX; rec.y=e.clientY;
  if(!gesture) return;
  if(gesture.mode==="pinch" && ptrs.size>=2){
    const p=[...ptrs.values()];
    const d=dist(p[0],p[1]);
    const mx=(p[0].x+p[1].x)/2, my=(p[0].y+p[1].y)/2;
    let ns=clamp(gesture.s0 * (d/gesture.d0), 0.12, 5);
    cam.scale=ns;
    // keep the initial pinch world-point under the current midpoint
    cam.x = gesture.wx - (mx - W/2)/cam.scale;
    cam.y = gesture.wy - (my - H/2)/cam.scale;
    requestFrame(); return;
  }
  const dx=e.clientX-gesture.x0, dy=e.clientY-gesture.y0;
  if(!gesture.moved && Math.hypot(dx,dy)>TAP_MOVE) gesture.moved=true;

  if(gesture.mode==="node"){
    if(gesture.moved){
      const nd=gesture.node; nd._drag=true;
      // free to move, but distance from parent is bounded so the layout stays organized
      const par=byId(nd.parentId)||ME;
      let wx=toWorldX(e.clientX), wy=toWorldY(e.clientY);
      let ddx=wx-(par.x||0), ddy=wy-(par.y||0); let dd=Math.hypot(ddx,ddy)||0.01;
      const rest=(par._r||40)+(nd._r||18)+46;
      const cl=clamp(dd, rest*0.4, rest*5.0);   // lots of room to arrange
      nd.x=(par.x||0)+ddx/dd*cl; nd.y=(par.y||0)+ddy/dd*cl;
      nd.vx=0; nd.vy=0; requestFrame();
    }
  }else if(gesture.mode==="maybeMe" || gesture.mode==="pan"){
    if(gesture.moved){

      cam.y -= (e.clientY-rec_prevY(e))/cam.scale;

// track previous position per move for smooth pan
let _prev={};
function rec_prevX(e){ const v=_prev[e.pointerId]?.x ?? e.clientX; _prev[e.pointerId]={x:e.clientX,y:_prev[e.pointerId]?.y ?? e.clientY}; return v; }

function onUp(e){
  const rec=ptrs.get(e.pointerId);

    const isTap = !gesture.moved && (Date.now()-gesture.t)<TAP_TIME;
    if(isTap && gesture.mode==="node"){ handleNodeTap(gesture.node); }
    else if(isTap && gesture.mode==="maybeMe"){ if(selectedId==="me"){ openMeSheet(); } else { selectedId="me"; requestFrame(); } }
    else if(isTap && gesture.mode==="pan"){ if(selectedId){ selectedId=null; requestFrame(); } }  // tap empty space = deselect
    if(gesture.mode==="node" && gesture.node){ gesture.node._drag=false; if(gesture.moved){ gesture.node.pinned=true; toast("Pinned here"); } kick(0.2); save(); }
  }
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){ gesture=null; interacting=false; if(hadPinch){ lastPinchEnd=Date.now(); hadPinch=false; } save(); }
  else if(ptrs.size===1){ // dropped to one finger -> resume pan
    const p=[...ptrs.entries()][0]; _prev[p[0]]={x:p[1].x,y:p[1].y};

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
let lastNodeTap={id:null,t:0};
function handleNodeTap(n){
  const now=Date.now();

    // fast double-tap → lock / release position
    n.pinned=!n.pinned; if(!n.pinned) kick(0.6); save(); refreshChrome&&refreshChrome();

  }

canvas.addEventListener("pointerdown",onDown);
canvas.addEventListener("pointermove",e=>{ // init prev on first move
  if(gesture && (gesture.mode==="pan"||gesture.mode==="maybeMe") && !_prev[e.pointerId]) _prev[e.pointerId]={x:e.clientX,y:e.clientY};

canvas.addEventListener("pointerup",onUp);
canvas.addEventListener("pointercancel",onUp);
canvas.addEventListener("wheel",e=>{

  const f=Math.exp(-e.deltaY*0.0015);

// double-tap / double-click to zoom in (never right after a pinch, never mid multi-touch)
let lastTap=0;
canvas.addEventListener("pointerup",e=>{
  if(ptrs.size>0) return;                     // other fingers still down
  if(Date.now()-lastPinchEnd<600) return;     // just finished pinching — ignore
  const now=Date.now();
  if(now-lastTap<300 && !nodeAt(e.clientX,e.clientY)){ zoomAt(e.clientX,e.clientY,clamp(cam.scale*1.8,0.12,5)); }
  lastTap=now;
});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{ if(e.target===canvas) e.preventDefault(); },{passive:false});

function zoomAt(sx,sy,ns){
  const wx=toWorldX(sx), wy=toWorldY(sy);
  cam.scale=ns; cam.x=wx-(sx-W/2)/cam.scale; cam.y=wy-(sy-H/2)/cam.scale;
  requestFrame(); save();
}
function focusNode(n){
  const ns=clamp(1.5, 0.12,5);
  animateCam(n.x, n.y, ns); selectedId=n.id; focusPulse=1; ensureLoop();
}
function fitAll(){
  const all=allNodes().filter(n=>n.x!=null && n._vis!==false);
  if(all.length<=1){ animateCam(0,0,1); return; }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const n of all){ minX=Math.min(minX,n.x-n._r);maxX=Math.max(maxX,n.x+n._r);minY=Math.min(minY,n.y-n._r);maxY=Math.max(maxY,n.y+n._r); }
  const w=maxX-minX, h=maxY-minY;
  const s=clamp(Math.min((W-80)/w,(H-220)/h),0.12,2.2);
  animateCam((minX+maxX)/2,(minY+maxY)/2,s);
}
function animateCam(tx,ty,ts){
  const sx=cam.x,sy=cam.y,ss=cam.scale; const t0=performance.now(), dur=520;
  function tick(now){
    const k=clamp((now-t0)/dur,0,1); const e=1-Math.pow(1-k,3);
    cam.x=sx+(tx-sx)*e; cam.y=sy+(ty-sy)*e; cam.scale=ss+(ts-ss)*e;
    render();
    if(k<1) requestAnimationFrame(tick); else save();
  }
  requestAnimationFrame(tick);

/* ============================================================
   SHEETS / UI
============================================================ */
const scrim=document.getElementById("scrim");
const sheet=document.getElementById("sheet");
let sheetOpen=false;
function openSheet(html){

  const x=document.getElementById("__sx"); if(x) x.onclick=closeSheet;
  scrim.classList.add("on"); sheet.classList.add("on"); sheetOpen=true;
}
function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); sheet.style.transform=""; sheetOpen=false; }
scrim.addEventListener("click",closeSheet);
/* swipe down anywhere on a sheet to dismiss it (attached once, not per open) */
(function initSheetGestures(){
  let y0=null, dy=0, engaged=false;
  sheet.addEventListener("touchstart",e=>{
    if(e.touches.length!==1) return;
    y0=e.touches[0].clientY; dy=0;
    // engage from the grab handle, or from anywhere as long as we're at the top of the content
    engaged = !!(e.target.closest && e.target.closest(".sheet-top")) || sheet.scrollTop<=0;
    if(engaged) sheet.style.transition="none";
  },{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(y0==null||!engaged||e.touches.length!==1) return;
    dy=e.touches[0].clientY-y0;
    if(dy>0) sheet.style.transform="translateY("+dy+"px)";
  },{passive:true});
  const finish=()=>{
    if(y0==null) return;
    sheet.style.transition="";
    if(engaged && dy>90) closeSheet(); else sheet.style.transform="";
    y0=null; dy=0; engaged=false;
  };
  sheet.addEventListener("touchend",finish);
  sheet.addEventListener("touchcancel",finish);
})();

}

/* ---- social link building ---- */
function socialHref(kind,val){
  if(!val) return null; const v=val.trim();
  if(/^https?:\/\//i.test(v)) return v;
  switch(kind){
    case "instagram": return "https://instagram.com/"+v.replace(/^@/,"");
    case "linkedin": return "https://www.linkedin.com/in/"+encodeURIComponent(v.replace(/^@/,""));
    case "x": return "https://x.com/"+v.replace(/^@/,"");
    case "whatsapp": return "https://wa.me/"+v.replace(/[^0-9]/g,"");
    case "email": return "mailto:"+v;
    case "phone": return "tel:"+v.replace(/[^0-9+]/g,"");
    default: return v;
  }
}
const SOCIAL_META={
  instagram:{i:"IG",ph:"@handle or URL"},
  whatsapp:{i:"WA",ph:"phone number"},
  linkedin:{i:"in",ph:"profile URL or handle"},
  x:{i:"X",ph:"@handle or URL"},
  email:{i:"@",ph:"email address"},
  phone:{i:"☎",ph:"phone number"},
};
function bestReach(n){
  const s=n.socials||{};
  for(const k of ["whatsapp","instagram","phone","email","linkedin","x"]) if(s[k]) return {k,href:socialHref(k,s[k])};
  return null;
}

}

/* ---------- REMINDERS ---------- */
function computeReminders(){
  const people=state.nodes.filter(n=>n.type==="person");
  const todayB=[], soonB=[], overdue=[];
  people.forEach(p=>{
    if(p.birthday){ const du=daysUntilBirthday(p.birthday); if(du===0) todayB.push(p); else if(du>0&&du<=30) soonB.push({p,du}); }
    const cs=contactStatus(p); if(cs&&cs.state==="overdue") overdue.push({p,over:Math.abs(cs.left)});
  });
  soonB.sort((a,b)=>a.du-b.du); overdue.sort((a,b)=>b.over-a.over);
  return {todayB,soonB,overdue};
}
function openReminders(){
  const {todayB,soonB,overdue}=computeReminders();
  const row=(p,ds,dotc,ic,extra="")=>`
    <div class="rem-item" data-id="${p.id}">
      <div class="dot" style="background:${hexA(nodeColor(p),0.22)};color:${nodeColor(p)}">${ic}</div>
      <div style="flex:1"><div class="nm">${esc(p.name)}</div><div class="ds">${ds}</div></div>
      ${extra}<div class="go">&#8250;</div>
    </div>`;
  let body="";
  if(todayB.length){ body+=`<div class="seg-title">🎂 Birthdays today</div>`+todayB.map(p=>{
    const rr=bestReach(p); const btn=rr?`<a class="chip act" style="flex:0 0 auto;text-decoration:none;padding:8px 12px" href="${esc(rr.href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Message</a>`:"";
    return row(p, "Turning "+(turningAge(p.birthday)||"?"), "#FFD60A","🎂",btn);
  }).join(""); }
  if(overdue.length){ body+=`<div class="seg-title" style="color:var(--red)">Overdue to reconnect</div>`+overdue.map(o=>{
    const rr=bestReach(o.p); const btn=rr?`<a class="chip act" style="flex:0 0 auto;text-decoration:none;padding:8px 12px" href="${esc(rr.href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Reach</a>`:"";
    return row(o.p, `${o.over} day${o.over===1?"":"s"} overdue`, "#FF453A","⏰",btn);
  }).join(""); }
  if(soonB.length){ body+=`<div class="seg-title">Upcoming birthdays</div>`+soonB.map(s=>row(s.p, `in ${s.du} day${s.du===1?"":"s"} &middot; ${new Date(s.p.birthday).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`,"#FF9F0A","🎈")).join(""); }
  if(!body) body=`<div style="text-align:center;color:var(--txt2);padding:40px 10px">You're all caught up.<br/>Set birthdays and check-in rhythms to get nudges here.</div>`;

  const notifBtn = ("Notification" in window && Notification.permission!=="granted")
    ? `<button class="btn ghost" id="rNotif">Enable phone notifications</button>` : "";
  openSheet(`<div class="sh-title">Reminders</div><div class="sh-sub">Birthdays & people to reconnect with</div>${body}<button class="btn ghost" id="rWheel">🎂 Birthday wheel</button>${notifBtn}`);
  sheet.querySelectorAll(".rem-item").forEach(it=>it.onclick=()=>{ const n=byId(it.dataset.id); if(n){ closeSheet(); focusNode(n); setTimeout(()=>openDetail(n),560); } });
  document.getElementById("rWheel").onclick=()=>{ closeSheet(); openBirthdayWheel(); };
  const nb=document.getElementById("rNotif"); if(nb) nb.onclick=async()=>{ try{ const p=await Notification.requestPermission(); if(p==="granted"){ toast("Notifications on"); runNotify(true);} }catch(e){} openReminders(); };
}

/* ---------- SEARCH ---------- */
function openSearch(){
  const list=state.nodes.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const render=(q)=>{
    const f=list.filter(n=>n.name.toLowerCase().includes(q.toLowerCase()));
    return f.map(n=>`<div class="rem-item" data-id="${n.id}">
      <div class="dot" style="background:${hexA(nodeColor(n),0.22)};color:${nodeColor(n)}">${isContainerType(n.type)?(n.emoji||(n.type==="event"?"🎉":"📍")):initials(n.name)}</div>
      <div style="flex:1"><div class="nm">${esc(n.name)}</div><div class="ds">${n.type==="place"?"Place":n.type==="event"?"Event":(CAT[n.category]||{}).label||"Person"}</div></div>
      <div class="go">&#8250;</div></div>`).join("") || `<div style="text-align:center;color:var(--txt2);padding:30px">No matches</div>`;
  };
  openSheet(`<div class="sh-title">Find</div><input id="sq" placeholder="Search people and places" autocomplete="off" style="margin-top:12px"/><div id="sres" style="margin-top:10px">${render("")}</div>`);

}

  // strip every runtime field (anything starting with "_") so backups stay clean

function normNodes(s){ if(Array.isArray(s)) return s; if(s&&Array.isArray(s.nodes)) return s.nodes; return null; }
function applyBackup(s,mode){
  const incoming=normNodes(s);
  if(!incoming){ toast("No people found in that backup"); return; }
  try{ localStorage.setItem("orbit.state.autobackup",backupJSON()); }catch(e){} // safety snapshot
  if(mode==="replace"){
    // keep any saved hand-organised position (fx/fy) so restoring a backup keeps your layout
    state.nodes=incoming.map(n=>Object.assign({},n,{x:(n.fx!=null?n.fx:null),y:(n.fy!=null?n.fy:null)}));
    if(s&&s.userName){ state.userName=s.userName; ME.name=s.userName; }
    if(s&&s.me&&s.me.name){ ME.name=s.me.name; state.userName=ME.name; }
  }else{
    const idMap={}; incoming.forEach(n=>{ idMap[n.id]=uid(); });
    incoming.forEach(n=>{
      const c=Object.assign({},n,{id:idMap[n.id],x:null,y:null});
      c.parentId = (n.parentId && n.parentId!=="me" && idMap[n.parentId]) ? idMap[n.parentId] : "me";
      c.introducedById = (n.introducedById && idMap[n.introducedById]) ? idMap[n.introducedById] : null;
      state.nodes.push(c);
    });
  }
  repairParents(); rebuild(); save(); kick(1); refreshChrome(); closeSheet(); setTimeout(fitAll,400);
  toast(mode==="merge"?"Merged in":"Restored");
}

/* ============================================================
   PATHS + BACKUP REPAIR (full-path portability)
============================================================ */
function pathOf(n){
  const out=[]; let cur=byId(n.parentId); let g=0;
  while(cur && cur.id!=="me" && g++<60){ out.unshift({name:cur.name,type:cur.type}); cur=byId(cur.parentId); }
  return out;
}
function pathString(n){
  const names=[]; let cur=byId(n.parentId); let g=0;
  while(cur && cur.id!=="me" && g++<60){ names.unshift(cur.name); cur=byId(cur.parentId); }
  return names.length? names.join(" › ") : "Direct";
}
function ensurePath(pathArr){
  let parent="me";
  for(const step of (pathArr||[])){
    let found=state.nodes.find(n=>n.name===step.name && n.type===step.type && n.parentId===parent);
    if(!found){ found={id:uid(),createdAt:Date.now(),type:step.type,name:step.name,parentId:parent,x:null,y:null};
      if(step.type==="person"){ found.category="friend"; found.closeness=5; found.socials={}; found.cadenceDays=0; }
      state.nodes.push(found); }
    parent=found.id;
  }
  return parent;
}
function repairParents(){
  // any node whose parent id is missing gets rebuilt from its stored path
  state.nodes.forEach(n=>{
    if(n.parentId && n.parentId!=="me" && !byId(n.parentId)){
      n.parentId = (Array.isArray(n.path)&&n.path.length)? ensurePath(n.path) : "me";
    }
  });
  state.nodes.forEach(n=>{ delete n.path; });
}

/* ---------- identity, de-duplication & tombstones ---------- */
function idKey(n){ return n.type+"|"+(n.name||"").trim().toLowerCase()+"|"+pathString(n).toLowerCase(); }
function mergeFields(keep,dup){
  ["photo","birthday","notes","emoji","description","introducedById","category","color","city"].forEach(f=>{ if(!keep[f] && dup[f]) keep[f]=dup[f]; });
  if(dup.closeness && (dup.closeness>(keep.closeness||0))) keep.closeness=dup.closeness;
  if(dup.socials) keep.socials=Object.assign({}, dup.socials, keep.socials||{});
  if(dup.lastContact && (!keep.lastContact || dup.lastContact>keep.lastContact)) keep.lastContact=dup.lastContact;
  if(dup.cadenceDays && !keep.cadenceDays) keep.cadenceDays=dup.cadenceDays;
  if(dup.createdAt && (!keep.createdAt || dup.createdAt<keep.createdAt)) keep.createdAt=dup.createdAt;
}
// collapse bubbles that are the same thing (same type + name + place), deterministically (smallest id wins)
function dedupe(){
  rebuild();
  const groups={};
  state.nodes.forEach(n=>{ const k=idKey(n); (groups[k]||(groups[k]=[])).push(n); });
  const canon={}; let removed=0;
  Object.keys(groups).forEach(k=>{
    const g=groups[k]; if(g.length<2) return;
    g.sort((a,b)=> String(a.id)<String(b.id)?-1:1);
    const keep=g[0];
    for(let i=1;i<g.length;i++){ mergeFields(keep,g[i]); canon[g[i].id]=keep.id; removed++; }
  });
  if(removed){
    const rm=new Set(Object.keys(canon));
    state.nodes=state.nodes.filter(x=>!rm.has(x.id));
    state.nodes.forEach(x=>{ if(canon[x.parentId]) x.parentId=canon[x.parentId]; if(x.introducedById&&canon[x.introducedById]) x.introducedById=canon[x.introducedById]; });
    rebuild();
  }
  return removed;
}
function tombstone(n){ if(!state.tombstones) state.tombstones={}; state.tombstones[idKey(n)]=Date.now(); }
// remove nodes that were deleted (on any device) after they were created
function applyTombstones(){
  const t=state.tombstones; if(!t) return 0;
  rebuild();
  const before=state.nodes.length;
  state.nodes=state.nodes.filter(n=>{ const ts=t[idKey(n)]; return !(ts && (n.createdAt||0) < ts); });
  const removed=before-state.nodes.length;
  if(removed) rebuild();
  return removed;
}
function pruneTombstones(){ const t=state.tombstones||{}; const cut=Date.now()-120*DAY; for(const k in t){ if(t[k]<cut) delete t[k]; } }

   LIST / RECONNECT VIEW
============================================================ */
let listOpen=false, listSort="urgency";
function urgencyScore(p){
  let s=0; const cs=contactStatus(p);
  if(cs){ if(cs.state==="overdue") s+=1000+Math.min(Math.abs(cs.left),365); else if(cs.state==="soon") s+=350; }
  if(p.birthday){ const du=daysUntilBirthday(p.birthday); if(du!=null&&du<=14) s+=800-du*12; }
  // slow decay: close people you haven't logged nudge upward
  if(!cs && (p.closeness||0)>=7) s+=120;
  s += (p.closeness||0);
  return s;
}
function setSeg(){ const u=document.getElementById("sortUrg"),a=document.getElementById("sortAZ");
  if(u&&a){ u.classList.toggle("on",listSort==="urgency"); a.classList.toggle("on",listSort==="az"); } }

/* ============================================================
   INTELLIGENCE: suggested cadence + data-gap queue
============================================================ */
// closeness drives how often you'd naturally want to be in touch
function suggestedCadence(p){
  const c=clamp(p.closeness||5,1,10);
  if(c>=9) return 30;
  if(c>=7) return 60;
  if(c>=5) return 90;
  if(c>=3) return 180;
  return 0;                       // acquaintances: no nagging
}
function cadenceCandidates(){
  return state.nodes.filter(p=>p.type==="person" && !p.cadenceDays && suggestedCadence(p)>0);
}
function applySuggestedCadence(){
  const list=cadenceCandidates(); let n=0;
  list.forEach(p=>{ p.cadenceDays=suggestedCadence(p); if(!p.lastContact) p.lastContact=Date.now(); n++; });
  if(n){ rebuild(); save(); kick(0.4); refreshChrome(); if(listOpen) renderList(); }
  return n;
}
function gapGroups(){
  const ppl=state.nodes.filter(p=>p.type==="person");
  return {
    reach:  ppl.filter(p=>{ const s=p.socials||{}; return !Object.keys(s).some(k=>s[k]); }),
    bday:   ppl.filter(p=>!p.birthday),
    photo:  ppl.filter(p=>!p.photo),
    cadence:cadenceCandidates(),
  };
}
function openGaps(kind){
  const g=gapGroups();
  const k=kind||"reach";
  const titles={reach:"No way to reach them",bday:"Missing birthday",photo:"No photo",cadence:"No check-in rhythm"};
  const list=g[k]||[];
  const tab=(id,label,count)=>`<div class="chip gtab ${k===id?'on sel':''}" data-k="${id}">${label} ${count}</div>`;
  const rows=list.slice(0,80).map(p=>`<div class="rem-item" data-id="${p.id}">
      <div class="dot" style="background:${hexA(nodeColor(p),0.22)};color:${nodeColor(p)}">${p.emoji||initials(p.name)}</div>
      <div style="flex:1;min-width:0"><div class="nm">${esc(p.name)}</div><div class="ds">${esc(cityOf(p)||pathString(p))}</div></div>
      <div class="go">&#8250;</div></div>`).join("") ||
    `<div style="text-align:center;color:var(--txt2);padding:34px">Nothing missing here. 🎉</div>`;
  openSheet(`<div class="sh-title">Fill the gaps</div>
    <div class="sh-sub">The fastest way to make Orbit smarter</div>
    <div class="chips" style="margin-top:12px">
      ${tab("reach","Unreachable",g.reach.length)}${tab("bday","No birthday",g.bday.length)}
      ${tab("photo","No photo",g.photo.length)}${tab("cadence","No rhythm",g.cadence.length)}
    </div>
    ${k==="cadence" && g.cadence.length ? `<button class="btn primary" id="gApply">Set a smart rhythm for all ${g.cadence.length}</button>
      <div style="font-size:11px;color:var(--txt3);line-height:1.5;margin-top:6px">Based on closeness: 9–10 → 30 days · 7–8 → 60 · 5–6 → 90 · 3–4 → 180 · below that, none.</div>`:""}
    <div style="margin-top:10px">${rows}</div>`);
  sheet.querySelectorAll(".gtab").forEach(t=>t.onclick=()=>openGaps(t.dataset.k));
  sheet.querySelectorAll(".rem-item").forEach(it=>it.onclick=()=>{ const p=byId(it.dataset.id); if(p) openPersonForm(p,p.parentId); });
  const ga=document.getElementById("gApply");
  if(ga) ga.onclick=()=>{ const n=applySuggestedCadence(); toast(n?("Set rhythms for "+n+" people"):"Nothing to set"); openGaps("cadence"); };
}

/* ============================================================
   BIRTHDAY WHEEL (year circle)
============================================================ */
function closeBirthdayWheel(){ document.getElementById("bwheel").classList.add("hidden"); }
function openBirthdayWheel(){
  const wrap=document.getElementById("bwheel"); wrap.classList.remove("hidden");
  const CUM=[0,31,59,90,120,151,181,212,243,273,304,334];
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cx=180,cy=180,R=140;
  const doy=(m,d)=>CUM[m-1]+d;
  const ang=f=> -Math.PI/2 + f*Math.PI*2;
  const pt=(f,r)=>[cx+Math.cos(ang(f))*r, cy+Math.sin(ang(f))*r];
  const people=state.nodes.filter(n=>n.type==="person" && n.birthday && parseYMD(n.birthday));

  let svg=`<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${R-52}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  for(let m=0;m<12;m++){
    const f=CUM[m]/365; const a=pt(f,R-6), b=pt(f,R+6);
    svg+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>`;
    const l=pt((CUM[m]+15)/365, R+22);
    svg+=`<text x="${l[0].toFixed(1)}" y="${l[1].toFixed(1)}" fill="rgba(255,255,255,0.5)" font-size="11" text-anchor="middle" dominant-baseline="middle">${MON[m]}</text>`;
  }
  // today needle
  const now=new Date(); const tf=doy(now.getMonth()+1, now.getDate())/365; const tp=pt(tf,R);
  svg+=`<line x1="${cx}" y1="${cy}" x2="${tp[0].toFixed(1)}" y2="${tp[1].toFixed(1)}" stroke="#FFD60A" stroke-width="2"/>`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#FFD60A"/>`;
  const tl=pt(tf,R-30); svg+=`<text x="${tl[0].toFixed(1)}" y="${tl[1].toFixed(1)}" fill="#FFD60A" font-size="9" text-anchor="middle">today</text>`;
  // birthday dots (stack same-day inward)
  const byDay={};
  people.forEach(p=>{ const b=parseYMD(p.birthday); (byDay[b.m+"-"+b.d]||(byDay[b.m+"-"+b.d]=[])).push(p); });
  Object.keys(byDay).forEach(key=>{
    const arr=byDay[key]; const b=parseYMD(arr[0].birthday); const f=doy(b.m,b.d)/365;
    arr.forEach((p,i)=>{ const rr=Math.max(R-i*13, R-52); const c=pt(f,rr); const col=nodeColor(p);
      svg+=`<circle class="bwdot" data-id="${p.id}" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="6.5" fill="${col}" stroke="rgba(0,0,0,0.55)" stroke-width="1"><title>${esc(p.name)} · ${MON[b.m-1]} ${b.d}</title></circle>`;
    });
  });
  svg+=`</svg>`;
  document.getElementById("bwWrap").innerHTML=svg;

  const up=people.map(p=>({p,du:daysUntilBirthday(p.birthday)})).filter(x=>x.du!=null).sort((a,b)=>a.du-b.du);
  let info=`<div style="font-size:13px;color:var(--txt2);padding:6px 2px 10px">${people.length} ${people.length===1?"birthday":"birthdays"}${up.length?` · next: ${esc(firstName(up[0].p.name))} in ${up[0].du}d`:""}</div>`;
  info+=up.slice(0,8).map(x=>{ const b=parseYMD(x.p.birthday); const col=nodeColor(x.p);
    return `<div class="bw-row" data-id="${x.p.id}"><div class="dot" style="background:${hexA(col,0.22)};color:${col}">${x.p.emoji||initials(x.p.name)}</div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(x.p.name)}</div>
      <div style="font-size:12px;color:var(--txt2)">${MON[b.m-1]} ${b.d} · ${x.du===0?"today 🎂":"in "+x.du+"d"}</div></div><div class="go" style="color:var(--txt3)">&#8250;</div></div>`;
  }).join("") || `<div style="text-align:center;color:var(--txt2);padding:24px">No birthdays yet — add them on people to see them here.</div>`;
  document.getElementById("bwInfo").innerHTML=info;

  const jump=id=>{ const n=byId(id); if(n){ closeBirthdayWheel(); focusNode(n); setTimeout(()=>openDetail(n),560); } };
  wrap.querySelectorAll(".bwdot").forEach(el=>el.addEventListener("click",()=>jump(el.getAttribute("data-id"))));
  wrap.querySelectorAll(".bw-row").forEach(el=>el.onclick=()=>jump(el.getAttribute("data-id")));
}

/* ============================================================
   CALENDAR EXPORT (.ics)
============================================================ */
function pad2(x){ return String(x).padStart(2,"0"); }
function icsEsc(t){ return (t||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }
function buildICS(){
  const now=new Date();
  const stamp=now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+"T"+pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+pad2(now.getUTCSeconds())+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Orbit//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Orbit"];
  state.nodes.filter(n=>n.type==="person").forEach(p=>{
    if(p.birthday){ const b=parseYMD(p.birthday); if(b){
      L.push("BEGIN:VEVENT","UID:orbit-bday-"+p.id+"@orbit","DTSTAMP:"+stamp,
        "DTSTART;VALUE=DATE:"+b.y+pad2(b.m)+pad2(b.d),"RRULE:FREQ=YEARLY",
        "SUMMARY:🎂 "+icsEsc(p.name)+"'s birthday",
        "BEGIN:VALARM","TRIGGER:-PT9H","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(p.name+"'s birthday"),"END:VALARM","END:VEVENT");
    }}
    if(p.cadenceDays && p.lastContact){
      const nx=new Date(p.lastContact + p.cadenceDays*DAY);
      L.push("BEGIN:VEVENT","UID:orbit-checkin-"+p.id+"@orbit","DTSTAMP:"+stamp,
        "DTSTART;VALUE=DATE:"+nx.getFullYear()+pad2(nx.getMonth()+1)+pad2(nx.getDate()),
        "RRULE:FREQ=DAILY;INTERVAL="+p.cadenceDays,
        "SUMMARY:📞 Check in with "+icsEsc(p.name),
        "BEGIN:VALARM","TRIGGER:PT9H","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("Reconnect with "+p.name),"END:VALARM","END:VEVENT");
    }
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function exportICS(){
  try{
    const blob=new Blob([buildICS()],{type:"text/calendar"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="orbit-reminders.ics"; document.body.appendChild(a); a.click(); a.remove();
    toast("Calendar file created — open it to add");
  }catch(e){ toast("Couldn't create calendar file"); }
}

/* ============================================================
   ACCOUNTS (Supabase) — optional; app is fully local without it
============================================================ */
let sb=null, sbUser=null, sbReady=false;
function accountsEnabled(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
async function initAccounts(){
  if(!accountsEnabled()) return false;
  try{
    if(!window.supabase){                       // load the SDK on demand
      await new Promise((res,rej)=>{ const s=document.createElement("script");
        s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        s.onload=res; s.onerror=()=>rej(new Error("offline")); document.head.appendChild(s); });
    }
    sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data}=await sb.auth.getSession();
    sbUser=(data&&data.session)?data.session.user:null;
    sbReady=true;
    return true;
  }catch(e){ sbReady=false; return false; }     // offline / blocked → stay local
}
function signedIn(){ return !!(sb&&sbUser); }
async function sbSignUp(email,pass){
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error) throw error;
  if(!data.session){ // email confirmation is still switched on in the project
    const r=await sb.auth.signInWithPassword({email,password:pass});
    if(r.error) throw new Error("Account made, but confirmation is on. Turn off “Confirm email” in Supabase → Authentication → Sign In / Providers.");
    sbUser=r.data.user; return;
  }
  sbUser=data.user;
}
async function sbSignIn(email,pass){
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error) throw error;
  sbUser=data.user;
}
async function sbSignOut(){ try{ await sb.auth.signOut(); }catch(e){} sbUser=null; }
async function sbPull(){
  if(!signedIn()) return {ok:false,err:"not signed in"};
  const {data,error}=await sb.from("orbits").select("data").eq("user_id",sbUser.id).maybeSingle();
  if(error) return {ok:false,err:error.message};
  return {ok:true,data:(data&&data.data)?data.data:null};
}
async function sbPush(){
  if(!signedIn()) return {ok:false,err:"not signed in"};
  const payload=JSON.parse(backupJSON());
  const {error}=await sb.from("orbits").upsert({user_id:sbUser.id,data:payload,updated_at:new Date().toISOString()});
  if(error) return {ok:false,err:error.message};
  return {ok:true};
}

async function gistPull(){
  const c=gistCfg(); if(!c||!c.token||!c.id) return {ok:false,err:"not set up"};

    {headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json"}});

  const j=await res.json(); const f=j.files&&j.files["orbit.json"]; if(!f) return {ok:false,err:"no data"};
  let content=f.content;
  if(f.truncated && f.raw_url){ const r2=await fetch(f.raw_url); content=await r2.text(); }
  return {ok:true,data:JSON.parse(content)};
}
async function gistFind(){

// union-merge cloud nodes into local by id (never loses either side's additions)
function mergeCloudNodes(incoming){
  if(!Array.isArray(incoming)) return 0;
  rebuild();
  const beforeKeys=new Set(state.nodes.map(idKey));
  const have=new Set(state.nodes.map(n=>n.id));
  incoming.forEach(n=>{ if(n && n.id && !have.has(n.id)){ state.nodes.push(Object.assign({},n,{x:null,y:null})); } });
  repairParents(); dedupe(); applyTombstones();
  let added=0; state.nodes.forEach(n=>{ if(!beforeKeys.has(idKey(n))) added++; });
  return added;
}
// two-way: pull + merge + push, so adding on any device shows up everywhere
async function syncNow(silent, force){
  if(state.demo){ if(!silent) toast("This is the demo — finish the tour first"); return false; }
  // signed-in account takes precedence over the GitHub-gist route
  if(signedIn()){
    try{
      let added=0, cloudCount=0;
      const r=await sbPull();
      if(!r.ok){
        // the cloud is the safety net — if we can't read it, we must not overwrite it
        if(!silent) toast("Couldn't reach the cloud — your backup is untouched");
        return false;
      }
      if(r.data){
        if(r.data.tombstones){ if(!state.tombstones) state.tombstones={}; for(const k in r.data.tombstones){ state.tombstones[k]=Math.max(state.tombstones[k]||0, r.data.tombstones[k]); } }
        cloudCount=(normNodes(r.data)||[]).length;
        added=mergeCloudNodes(normNodes(r.data));
        if(!state.userName && r.data.userName){ state.userName=r.data.userName; ME.name=r.data.userName; }
        if(r.data.me){ if(!ME.photo && r.data.me.photo) ME.photo=r.data.me.photo; if(!ME.color && r.data.me.color) ME.color=r.data.me.color; }
      }
      if(added){ cloudDirty=true; kick(0.8); refreshChrome(); if(listOpen) renderList(); }
      // refuse to replace a populated cloud row with an empty local one
      if(cloudCount>0 && state.nodes.length===0){
        if(!silent) toast("Safety stop: not overwriting your cloud data with an empty app");
        return false;
      }
      let ok=true;
      if(force || cloudDirty || added>0){
        const p=await sbPush(); ok=p.ok;
        if(ok){ cloudDirty=false; try{ localStorage.setItem("orbit.lastlocal",String(Date.now())); }catch(e){} }
        if(!silent) toast(ok ? (added? ("Synced · "+added+" new from your other device") : "Synced") : "Sync failed: "+(p.err||""));
      } else if(!silent){ toast(added? ("Synced · "+added+" new") : "Up to date"); }
      return ok;
    }catch(e){ if(!silent) toast("Sync error — check your connection"); return false; }
  }
  const c0=gistCfg(); if(!c0||!c0.token){ if(!silent) toast("Set up cloud sync first"); return false; }
  try{
    let c=gistCfg();
    if(!c.id){ const f=await gistFind(); if(f){ c.id=f; setGistCfg(c); } }
    let added=0;
    if(gistCfg().id){ const r=await gistPull(); if(r.ok && r.data){
      if(r.data.tombstones){ if(!state.tombstones) state.tombstones={}; for(const k in r.data.tombstones){ state.tombstones[k]=Math.max(state.tombstones[k]||0, r.data.tombstones[k]); } }
      added=mergeCloudNodes(normNodes(r.data));
    } }
    if(added){ cloudDirty=true; kick(0.8); refreshChrome(); if(listOpen) renderList(); }
    let pushed=true;
    if(force || cloudDirty || added>0 || !gistCfg().id){
      const p=await gistPush(); pushed=p.ok;
      if(p.ok){ cloudDirty=false; try{ localStorage.setItem("orbit.lastlocal",String(Date.now())); }catch(e){} }
      if(!silent) toast(pushed ? (added? ("Synced · "+added+" new from your other device") : "Synced") : "Sync failed: "+(p.err||"check token"));
    } else if(!silent){
      toast(added? ("Synced · "+added+" new") : "Up to date");
    }
    return pushed;
  }catch(e){ if(!silent) toast("Sync error — use a classic token with the gist scope"); return false; }
}

  const c=gistCfg(); if(!c||!c.token) return;

}

/* ============================================================
   CONTACTS IMPORT (vCard)
============================================================ */
function parseVCard(text){
  const unfolded=(text||"").replace(/\r?\n[ \t]/g,""); // RFC line unfolding
  const blocks=unfolded.split(/BEGIN:VCARD/i).slice(1);
  const cards=[];
  blocks.forEach(b=>{
    const c={socials:{}};
    b.split(/\r?\n/).forEach(line=>{
      const up=line.toUpperCase(); const val=line.slice(line.indexOf(":")+1).trim();
      if(up.startsWith("FN:")) c.name=val;
      else if(up.startsWith("N:") && !c.name){ const p=val.split(";"); c.name=((p[1]||"")+" "+(p[0]||"")).trim(); }
      else if(up.startsWith("BDAY")){ const m=val.match(/(\d{4})-?(\d{2})-?(\d{2})/); if(m) c.birthday=m[1]+"-"+m[2]+"-"+m[3]; }
      else if(up.startsWith("TEL")){ if(val && !c.socials.phone) c.socials.phone=val; }
      else if(up.startsWith("EMAIL")){ if(val && !c.socials.email) c.socials.email=val; }
      else if(up.startsWith("URL")){ if(/instagram/i.test(val)) c.socials.instagram=val; else if(/linkedin/i.test(val)) c.socials.linkedin=val; }
    });
    if(c.name) cards.push(c);
  });
  return cards;
}
function importVCF(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const cards=parseVCard(rd.result); if(!cards.length){ toast("No contacts found in that file"); return; } confirmImportContacts(cards); };
  rd.readAsText(f);
}

      ${cards.length>60?`<div style="color:var(--txt2);padding:8px 2px">…and ${cards.length-60} more</div>`:""}
    </div>

  document.getElementById("ciNo").onclick=openMenu;

  };

function demoFace(seed){
  const c=document.createElement("canvas"); c.width=c.height=96; const g=c.getContext("2d");
  const h=(seed*53)%360;
  const bg=g.createLinearGradient(0,0,96,96);
  bg.addColorStop(0,"hsl("+h+" 72% 74%)"); bg.addColorStop(1,"hsl("+((h+45)%360)+" 62% 50%)");
  g.fillStyle=bg; g.fillRect(0,0,96,96);
  g.fillStyle="rgba(255,255,255,0.90)";
  g.beginPath(); g.arc(48,37,16,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(48,88,27,25,0,0,Math.PI*2); g.fill();
  return safeDataURL(c);
}
function demoScene(seed){

  sky.addColorStop(1,"hsl("+((h+55)%360)+" 55% 38%)");
