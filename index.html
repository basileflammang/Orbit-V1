/* ---------- the tour ---------- */
let tourIdx=0, tourSteps=[], tourOn=false;
/* place the sample network in a tidy ring instead of letting it start as a clump */
function seedDemoLayout(){
  rebuild();
  ME.x=0; ME.y=0;
  const tops=state.nodes.filter(n=>n.parentId==="me");
  const n=tops.length||1;
  const R=380;
  tops.forEach((t,i)=>{
    const a=(i/n)*Math.PI*2 - Math.PI/2;
    t.x=Math.cos(a)*R; t.y=Math.sin(a)*R; t.vx=0; t.vy=0;
    const kids=state.nodes.filter(k=>k.parentId===t.id);
    const spread=Math.min(Math.PI*0.85, 0.42*Math.max(1,kids.length));
    kids.forEach((k,j)=>{
      const off=kids.length===1?0:((j/(kids.length-1))-0.5)*spread;
      const rr=(t._r||45)+(k._r||18)+120;
      k.x=t.x+Math.cos(a+off)*rr; k.y=t.y+Math.sin(a+off)*rr; k.vx=0; k.vy=0;
      // grandchildren fan out one level further
      const g=state.nodes.filter(q=>q.parentId===k.id);
      g.forEach((q,m)=>{
        const o2=g.length===1?0:((m/(g.length-1))-0.5)*0.9;
        const r2=(k._r||22)+(q._r||16)+95;
        q.x=k.x+Math.cos(a+off+o2)*r2; q.y=k.y+Math.sin(a+off+o2)*r2; q.vx=0; q.vy=0;
      });
    });
  });
}
function startTour(){
  tourOn=true; state.demo=true;
  state.nodes=demoNetwork();
  imgCacheClear();
  seedDemoLayout();
  // settle it fully before the first frame so it never appears cramped
  simAlpha=1; for(let i=0;i<260;i++) stepSim();
  simAlpha=0.12;
  rebuild(); refreshChrome();
  fitAll();
  tourIdx=0; buildTourSteps();
  document.getElementById("tour").classList.remove("hidden");
  renderTourStep();
}
function imgCacheClear(){ for(const k in imgCache) delete imgCache[k]; }
function buildTourSteps(){
  const byName=nm=>state.nodes.find(x=>x.name===nm);
  tourSteps=[
    { t:"This is a demo", b:"We filled Orbit with made-up people so you can see how it works. Nothing here is yours — it disappears at the end.",
      before:()=>{ closeSheet(); } },
    { t:"You are the centre", b:"Everyone branches off you. The closer someone is to you, the bigger their bubble. Colours group each part of your life.",
      before:()=>{ selectedId=null; fitAll(); } },
    { t:"Places and events", b:"Add a city, a school, a gym or a wedding — then hang the people you met there off it. That's how you remember where someone is from.",
      before:()=>{ const p=byName("Lisbon"); if(p) focusNode(p); } },
    { t:"Tap once, then again", b:"One tap selects a bubble and dims the rest. A second tap opens their profile. Double-tap quickly to lock a bubble in place.",
      before:()=>{ const m=byName("Mia Fernandes"); if(m){ focusNode(m); setTimeout(()=>openDetail(m),620); } } },
    { t:"Never lose touch", b:"Give someone a rhythm — every 30, 60 or 90 days. The ring around them fills up, then turns red when it has been too long. Tap “I just reached out” to reset it.",
      before:()=>{} },
    { t:"Your reconnect list", b:"The list ranks everyone by who needs you most: overdue first, birthdays next. Tap ✨ for an AI-written plan.",
      target:()=>document.getElementById("btnList"),
      before:()=>{ closeSheet(); toggleList(true); } },
    { t:"Birthdays around the year", b:"A ring from January to December with everyone's birthday, and a marker for today — so you can see them coming.",
      target:()=>document.getElementById("btnBell"),
      before:()=>{ toggleList(false); openBirthdayWheel(); } },
    { t:"Everything else lives here", b:"Themes (try ✨ Sparkle), the world map, filters, backups and “Fill the gaps” — which tells you who is missing a birthday or a way to reach them.",
      target:()=>document.getElementById("btnMenu"),
      before:()=>{ closeBirthdayWheel(); closeSheet(); } },
    { t:"Add your first person", b:"The + button adds a person, a place or an event. Start with three or four people you never want to drift from.",
      target:()=>document.getElementById("fab"),
      before:()=>{ closeSheet(); fitAll(); }, last:true }
  ];
}
function renderTourStep(){
  const st=tourSteps[tourIdx]; if(!st) return finishTour();
  try{ if(st.before) st.before(); }catch(e){}
  document.getElementById("tourStep").textContent="Step "+(tourIdx+1)+" of "+tourSteps.length;
  document.getElementById("tourTitle").textContent=st.t;
  document.getElementById("tourBody").textContent=st.b;
  document.getElementById("tourNext").textContent=st.last?"Finish — start my own":"Next";
  const card=document.getElementById("tourCard");
  const ring=document.getElementById("tourRing");
  const el=st.target?st.target():null;
  if(el){
    const r=el.getBoundingClientRect();
    const pad=9;
    ring.style.left=(r.left-pad)+"px"; ring.style.top=(r.top-pad)+"px";
    ring.style.width=(r.width+pad*2)+"px"; ring.style.height=(r.height+pad*2)+"px";
    ring.style.borderRadius=(Math.max(r.width,r.height)/2+pad)+"px";
    ring.classList.add("on");
    card.classList.toggle("top", r.top>window.innerHeight*0.55);
  }else{
    ring.classList.remove("on"); card.classList.remove("top");
  }
}
function nextTourStep(){ tourIdx++; if(tourIdx>=tourSteps.length) finishTour(); else renderTourStep(); }
let tourReturnTo=null;
function replayTour(){
  tourReturnTo = JSON.parse(JSON.stringify({nodes:state.nodes, tomb:state.tombstones}));
  startTour();
}
function finishTour(){
  tourOn=false;
  document.getElementById("tour").classList.add("hidden");
  document.getElementById("tourRing").classList.remove("on");
  closeSheet(); toggleList(false); closeBirthdayWheel();
  // wipe every trace of the demo
  if(tourReturnTo){                       // replay: hand their real network back
    state.nodes=tourReturnTo.nodes; state.tombstones=tourReturnTo.tomb||{};
    tourReturnTo=null;
  } else {                                // first run: their own orbit starts empty
    state.nodes=[]; state.tombstones={};
  }
  state.demo=false;
  selectedId=null; imgCacheClear();
  markTourSeen();
  rebuild(); save(); refreshChrome(); kick(0.5);
  cam={x:0,y:0,scale:1}; requestFrame();
  toast(state.nodes.length? "Your network is back" : "All yours now — tap + to add someone");
  if(signedIn()) setTimeout(()=>syncNow(true,true),600);
}

/* ============================================================
   CHROME (top bar stats + bell badge)
============================================================ */
function applyTheme(){
  const sp = state.theme==="sparkle";
  document.body.classList.toggle("sparkle", sp);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", sp?"#FFEBF4":"#000000");
  const sbar=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(sbar) sbar.setAttribute("content", sp?"default":"black-translucent");
  sparkleField=null; bloomCache=null;
  const bi=document.getElementById("bootIcon"); if(bi) bi.src=currentIcon();
  const ai=document.getElementById("authIcon"); if(ai) ai.src=currentIcon();
  refreshPWAIcons();
  requestFrame();
}
function setTheme(t){
  state.theme = t==="sparkle" ? "sparkle" : "midnight";
  applyTheme(); rebuild(); save(); kick(0.25);
  if(listOpen) renderList();
}
function refreshChrome(){
  const ppl=state.nodes.filter(n=>n.type==="person").length;
  const plc=state.nodes.filter(n=>n.type==="place").length;
  const {todayB,overdue}=computeReminders();
  const od=overdue.length;
  document.getElementById("stats").innerHTML =
    `<span>${esc(ME.name)}'s network</span>`+
    (ppl?`<span>${ppl} ${ppl===1?"person":"people"}</span>`:"")+
    (plc?`<span>${plc} place${plc===1?"":"s"}</span>`:"")+
    (od?`<span class="od">${od} overdue</span>`:"");
  const badge=document.getElementById("bellBadge"); const c=todayB.length+od;
  if(c>0){ badge.textContent=c; badge.classList.remove("hidden"); } else badge.classList.add("hidden");
}

/* ============================================================
   NOTIFICATIONS (best-effort, while app is open)
============================================================ */
function runNotify(force){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const today=new Date().toDateString();
  if(!force && localStorage.getItem("orbit.notified")===today) return;
  localStorage.setItem("orbit.notified",today);
  const {todayB,overdue}=computeReminders();
  try{
    todayB.forEach(p=>new Notification("🎂 "+p.name+"'s birthday today",{body:"Send a message?",icon:currentIcon()}));
    if(overdue.length) new Notification("Orbit",{body:`${overdue.length} ${overdue.length===1?"person":"people"} to reconnect with`,icon:currentIcon()});
  }catch(e){}
}

   PWA install bits + wiring
============================================================ */
let _appleIcon=null,_manifestLink=null;
function refreshPWAIcons(){
  const ic=currentIcon();
  if(_appleIcon) _appleIcon.href=ic;
  try{
    const manifest={name:"Orbit",short_name:"Orbit",display:"standalone",
      background_color:state.theme==="sparkle"?"#FFEBF4":"#000000",
      theme_color:state.theme==="sparkle"?"#FFEBF4":"#000000",
      start_url:".",scope:".",icons:[{src:ic,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    if(_manifestLink) _manifestLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
  }catch(e){}
}
(function pwa(){
  const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=ICON; document.head.appendChild(al); _appleIcon=al;
  try{
    const manifest={name:"Orbit",short_name:"Orbit",display:"standalone",background_color:"#000000",theme_color:"#000000",start_url:".",scope:".",icons:[{src:ICON,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const ml=document.createElement("link"); ml.rel="manifest";
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
    document.head.appendChild(ml); _manifestLink=ml;
  }catch(e){}
})();
document.getElementById("bootIcon").src=ICON;
document.getElementById("authIcon").src=ICON;

document.getElementById("btnZoomOut").onclick=()=>zoomAt(W/2,H/2,clamp(cam.scale/1.5,0.12,5));

/* ============================================================
   BOOT
============================================================ */
function showApp(){
  document.getElementById("boot").classList.add("hidden");
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("controls").classList.remove("hidden");
  const hint=document.getElementById("hint"); hint.classList.remove("hidden");
  rebuild(); const d=dedupe(); applyTombstones(); pruneTombstones(); if(d) save();
  refreshChrome(); kick(1);
  setTimeout(()=>{ if(state.cam){ cam=state.cam; } fitAll(); },100);
  setTimeout(()=>runNotify(false),1500);
  cloudBootSync();
}
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true; const h=document.getElementById("hint"); h.style.opacity="0"; setTimeout(()=>h.classList.add("hidden"),700); }
setTimeout(hideHint,6000);

// runs once we know whether the person signed in or chose to stay local
function afterAuth(didSignIn){
  if(state.userName){ ME.name=state.userName; showApp(); }
  else{
    document.getElementById("boot").classList.remove("hidden");
    const inp=document.getElementById("nameInput"), btn=document.getElementById("startBtn");
    const go=()=>{ const v=inp.value.trim(); if(!v){inp.focus();return;} state.userName=v; ME.name=v; ME.x=0;ME.y=0; save(); showApp(); };
    btn.onclick=go; inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    setTimeout(()=>inp.focus(),400);
  }
  if(didSignIn) setTimeout(()=>syncNow(false,true),400);   // pull their network straight away
  // brand-new person with an empty orbit → show them what it can be
  setTimeout(()=>{
    if(!tourSeen() && !state.demo && state.nodes.length===0 && state.userName) startTour();
  }, didSignIn?1600:700);
}
function boot(){
  load(); applyTheme(); resize();
  // ask the browser to keep our storage (helps prevent eviction on iOS/Safari)
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(state.cam) cam=Object.assign({x:0,y:0,scale:1},state.cam);

  if(accountsEnabled()){
    document.getElementById("boot").classList.add("hidden");
    wireAuthScreen();
    initAccounts().then(ok=>{
      if(ok && signedIn()){ afterAuth(true); }                 // already signed in
      else if(ok && !state.userName && !state.nodes.length){ showAuth(); }  // brand-new person
      else if(ok && !signedIn() && !localStorage.getItem("orbit.localOnly")){ showAuth(); }
      else { afterAuth(false); }
    }).catch(()=>afterAuth(false));
  } else {
    afterAuth(false);
  }

  const tick=()=>{ if(!document.hidden && (signedIn() || (gistCfg()&&gistCfg().token))) syncNow(true); };
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ refreshChrome(); requestFrame(); tick(); } });
  setInterval(tick, 60000);
}
boot();
