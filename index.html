<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Orbit" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>Orbit</title>
<style>
  :root{
    --bg:#000; --panel:#1C1C1E; --panel2:#2C2C2E;
    --line:rgba(255,255,255,0.10); --line2:rgba(255,255,255,0.16);
    --txt:#fff; --txt2:rgba(255,255,255,0.55); --txt3:rgba(255,255,255,0.35);
    --close:#FF9F0A; --friend:#30D158; --family:#FF453A; --colleague:#0A84FF; --place:#BF5AF2;
    --amber:#FFD60A; --red:#FF453A; --green:#30D158;
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);}
  body{
    font-family:var(--sf);color:var(--txt);position:fixed;inset:0;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-font-smoothing:antialiased;
  }
  #map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;}

  /* ---------- top bar ---------- */
  #topbar{position:absolute;left:0;right:0;top:0;z-index:20;
    padding:calc(var(--safe-t) + 12px) 16px 10px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    background:linear-gradient(180deg,rgba(0,0,0,0.72),rgba(0,0,0,0));
    pointer-events:none;}
  #topbar > *{pointer-events:auto;}
  .title{font-size:26px;font-weight:800;letter-spacing:-0.03em;line-height:1;}
  .sub{font-size:12px;color:var(--txt2);margin-top:4px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .sub .od{color:var(--red);font-weight:600;}
  .topbtns{display:flex;gap:8px;align-items:center;}
  .icobtn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.08);border:0.5px solid var(--line2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;font-size:17px;cursor:pointer;transition:transform .15s;}
  .icobtn:active{transform:scale(0.9);}
  .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #000;}

  /* ---------- controls bottom-right ---------- */
  #controls{position:absolute;right:16px;bottom:calc(var(--safe-b) + 18px);z-index:20;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .ctl{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.09);border:0.5px solid var(--line2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;font-size:19px;cursor:pointer;transition:transform .15s;}
  .ctl:active{transform:scale(0.9);}
  #fab{width:58px;height:58px;border-radius:50%;background:#fff;color:#000;font-size:30px;font-weight:300;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 28px rgba(255,255,255,0.18);transition:transform .15s;}
  #fab:active{transform:scale(0.9);}

  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 26px);z-index:15;
    font-size:12px;color:var(--txt3);background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:20px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none;transition:opacity .6s;}

  /* ---------- scrim + sheet ---------- */
  #scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  #scrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0 auto;max-width:500px;
    background:var(--panel);border-top-left-radius:26px;border-top-right-radius:26px;
    border:0.5px solid var(--line);box-shadow:0 -12px 50px rgba(0,0,0,0.6);
    padding:10px 20px calc(var(--safe-b) + 22px);max-height:90vh;overflow-y:auto;
    transform:translateY(110%);transition:transform .38s cubic-bezier(.22,1,.36,1);-webkit-overflow-scrolling:touch;}
  .sheet.on{transform:translateY(0);}
  .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,0.22);margin:2px auto 14px;}
  .sh-title{font-size:23px;font-weight:800;letter-spacing:-0.02em;}
  .sh-sub{font-size:13px;color:var(--txt2);margin-top:3px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}

  label.fl{font-size:11px;font-weight:700;color:var(--txt2);letter-spacing:0.07em;text-transform:uppercase;display:block;margin:16px 0 7px;}
  input,select,textarea{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid var(--line2);color:#fff;
    font-size:15px;font-family:inherit;padding:12px 13px;border-radius:12px;outline:none;-webkit-appearance:none;appearance:none;}
  textarea{resize:none;min-height:64px;}
  input::placeholder,textarea::placeholder{color:var(--txt3);}
  input[type="date"]{color-scheme:dark;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='white' stroke-opacity='0.5' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
  input[type="range"]{-webkit-appearance:none;background:transparent;padding:0;height:26px;}
  input[type="range"]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(255,255,255,0.14);}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9.5px;box-shadow:0 2px 8px rgba(0,0,0,.5);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{flex:1 1 auto;text-align:center;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,0.06);border:0.5px solid var(--line2);color:var(--txt2);transition:transform .12s;white-space:nowrap;}
  .chip:active{transform:scale(.96);}
  .chip.on{color:#fff;}

  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
    transition:transform .14s;margin-top:10px;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:#fff;color:#000;}
  .btn.ghost{background:rgba(255,255,255,0.08);color:#fff;border:0.5px solid var(--line2);}
  .btn.danger{background:transparent;color:var(--red);font-weight:600;font-size:13px;padding:10px;}
  .btn.green{background:var(--green);color:#00330f;}
  .btn.disabled{opacity:.4;pointer-events:none;}

  .social-in{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.06);border:0.5px solid var(--line2);border-radius:12px;padding:0 12px;margin-bottom:8px;}
  .social-in span.i{color:var(--txt2);font-size:13px;width:20px;text-align:center;}
  .social-in input{border:none;background:transparent;padding:12px 0;border-radius:0;}

  .meter{display:flex;gap:4px;margin-top:8px;}
  .meter i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.08);}

  .link-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border:0.5px solid var(--line);
    border-radius:12px;padding:12px 13px;margin-bottom:8px;text-decoration:none;color:#fff;font-size:14px;}
  .link-row .i{width:22px;text-align:center;color:var(--txt2);}
  .link-row .arr{margin-left:auto;color:var(--txt3);}

  .rem-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:0.5px solid var(--line);cursor:pointer;}
  .rem-item:last-child{border-bottom:none;}
  .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .rem-item .nm{font-size:15px;font-weight:600;}
  .rem-item .ds{font-size:12px;color:var(--txt2);margin-top:1px;}
  .rem-item .go{margin-left:auto;color:var(--txt3);}
  .seg-title{font-size:12px;font-weight:700;color:var(--txt3);letter-spacing:0.06em;text-transform:uppercase;margin:18px 0 4px;}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--safe-b) + 90px);z-index:70;
    background:rgba(40,40,42,0.96);border:0.5px solid var(--line2);color:#fff;font-size:14px;font-weight:600;
    padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;backdrop-filter:blur(20px);}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- onboarding / loader ---------- */
  #boot{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:32px;text-align:center;}
  #boot img{width:96px;height:96px;border-radius:24px;margin-bottom:26px;box-shadow:0 12px 50px rgba(120,175,255,0.25);}
  #boot h1{font-size:44px;font-weight:800;letter-spacing:-0.03em;margin:0 0 10px;}
  #boot p{font-size:15px;color:var(--txt2);margin:0 0 32px;max-width:300px;line-height:1.45;}
  #boot .field{width:100%;max-width:320px;text-align:left;}
  #boot input{font-size:16px;padding:14px;}
  #boot .btn{max-width:320px;}
  .fade-in{animation:fadeIn .5s cubic-bezier(.22,1,.36,1);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- list view ---------- */
  #listview{position:absolute;left:0;right:0;top:0;bottom:0;z-index:16;background:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(var(--safe-t) + 92px) 16px calc(var(--safe-b) + 90px);}
  .lv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;}
  .seg{display:flex;background:rgba(255,255,255,0.08);border:0.5px solid var(--line2);border-radius:11px;padding:3px;}
  .segbtn{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt2);cursor:pointer;transition:transform .12s;}
  .segbtn:active{transform:scale(.96);}
  .segbtn.on{background:rgba(255,255,255,0.16);color:#fff;}
  .lv-summary{font-size:12px;color:var(--txt2);padding:2px 2px 12px;line-height:1.5;}
  .lv-msg{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#0A84FF;text-decoration:none;}
  #lvBody .rem-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #lvBody .rem-item .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  body.listmode #btnFit,body.listmode #btnZoomIn,body.listmode #btnZoomOut,body.listmode #hint{display:none !important;}

  .hidden{display:none !important;}
</style>
</head>
<body>
  <canvas id="map"></canvas>

  <div id="listview" class="hidden">
    <div class="lv-head">
      <div class="seg">
        <div class="segbtn on" id="sortUrg">Urgency</div>
        <div class="segbtn" id="sortAZ">A&ndash;Z</div>
      </div>
      <div class="icobtn" id="aiPlanBtn" title="AI outreach plan">&#10024;</div>
    </div>
    <div id="lvBody"></div>
  </div>

  <div id="topbar" class="hidden">
    <div>
      <div class="title">Orbit</div>
      <div class="sub" id="stats"></div>
    </div>
    <div class="topbtns">
      <div class="icobtn" id="btnList" title="List view">&#9776;</div>
      <div class="icobtn" id="btnSearch" title="Find">&#9906;</div>
      <div class="icobtn" id="btnBell" title="Reminders">&#9993;<span class="badge hidden" id="bellBadge">0</span></div>
      <div class="icobtn" id="btnMenu" title="Menu">&#8942;</div>
    </div>
  </div>

  <div id="controls" class="hidden">
    <div class="ctl" id="btnFit" title="Fit to screen">&#9713;</div>
    <div class="ctl" id="btnZoomIn">+</div>
    <div class="ctl" id="btnZoomOut">&minus;</div>
    <div id="fab" title="Add">+</div>
  </div>

  <div id="hint" class="hidden">Pinch to zoom &middot; drag to explore &middot; tap a bubble</div>

  <div id="scrim"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast"></div>

  <!-- boot / onboarding -->
  <div id="boot">
    <img id="bootIcon" alt="" />
    <h1>Orbit</h1>
    <p>A living map of the people you don't want to lose.</p>
    <div class="field">
      <label class="fl">Your name</label>
      <input id="nameInput" placeholder="What should we call you?" autocomplete="off" />
      <button class="btn primary" id="startBtn">Enter your orbit</button>
    </div>
  </div>

/* ============================================================
   STATE + PERSISTENCE
============================================================ */
const KEY = "orbit.state.v3";
let state = { userName:null, nodes:[], cam:null };
let ME = { id:"me", type:"me", name:"Me", parentId:null, x:0, y:0, vx:0, vy:0 };

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(!raw){
      // migrate from any older orbit.state.vN key so future versions never lose data
      const keys = Object.keys(localStorage).filter(k=>/^orbit\.state\.v/.test(k)).sort();
      if(keys.length) raw = localStorage.getItem(keys[keys.length-1]);
    }
    if(raw){
      const s = JSON.parse(raw);
      state.userName = s.userName ?? null;
      state.nodes = Array.isArray(s.nodes) ? s.nodes : [];
      state.cam = s.cam || null;
      if(s.me){ ME = Object.assign(ME, s.me); }
    }
  }catch(e){}
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify({
        userName: state.userName, nodes: state.nodes,
        me:{x:ME.x,y:ME.y,name:ME.name},
        cam:{x:cam.x,y:cam.y,scale:cam.scale}
      }));
      localStorage.setItem("orbit.lastlocal", String(Date.now()));
    }catch(e){}
    syncSoon();
  },250);
}

const PLACE_C = "#BF5AF2";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const DAY = 86400000;

function shade(hex, amt){
  const h=hex.replace("#","");
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const f=v=>clamp(Math.round(v*(1+amt)),0,255).toString(16).padStart(2,"0");
  return "#"+f(r)+f(g)+f(b);
}
function nodeColor(n){
  if(n.type==="me") return "#FFFFFF";
  if(n.type==="place") return PLACE_C;
  return (CAT[n.category]||CAT.friend).c;
}
function allNodes(){ return [ME, ...state.nodes]; }
function byId(id){ if(id==="me")return ME; return state.nodes.find(n=>n.id===id)||null; }

/* structure: children + descendant counts + radius, recomputed on mutation */
function rebuild(){
  const all = allNodes();
  const map = {};
  all.forEach(n=>{ n._kids=[]; map[n.id]=n; });
  all.forEach(n=>{ if(n.parentId!=null && map[n.parentId]) map[n.parentId]._kids.push(n); });
  // descendant count via DFS
  function desc(n){ let c=0; for(const k of n._kids){ c += 1 + desc(k); } n._desc=c; return c; }
  desc(ME);
  all.forEach(n=>{ n._r = radiusOf(n); });
}
function radiusOf(n){
  if(n.type==="me") return 46;
  const d = n._desc||0;
  const descBonus = Math.sqrt(d)*8;
  if(n.type==="place") return clamp(30 + descBonus*1.15, 32, 155);
  // strong, adaptive gradient by closeness (1..10) plus who branches off them
  const imp = clamp(n.closeness||5, 1, 10);
  const core = 14 + Math.pow(imp/10, 1.25) * 46;   // ~16 (distant) -> ~60 (inner circle)
  return clamp(core + descBonus*0.8, 15, 115);
}

/* dates */
function parseYMD(s){ if(!s) return null; const p=s.split("-").map(Number); if(p.length!==3||!p[0]) return null; return {y:p[0],m:p[1],d:p[2]}; }
function daysUntilBirthday(b){
  const p=parseYMD(b); if(!p) return null;
  const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let next=new Date(today.getFullYear(),p.m-1,p.d);
  if(next<today) next=new Date(today.getFullYear()+1,p.m-1,p.d);
  return Math.round((next-today)/DAY);
}
function turningAge(b){ const p=parseYMD(b); if(!p) return null; const now=new Date(); const todayD=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const thisYr=new Date(now.getFullYear(),p.m-1,p.d); const targetYr = thisYr<todayD ? now.getFullYear()+1 : now.getFullYear(); return targetYr - p.y; }
function elapsedDays(ts){ if(!ts) return null; return Math.floor((Date.now()-ts)/DAY); }

/* contact cadence status: returns {frac, left, color, state} */
function contactStatus(n){
  if(n.type!=="person" || !n.cadenceDays || !n.lastContact) return null;
  const el = (Date.now()-n.lastContact)/DAY;
  const frac = el / n.cadenceDays;
  const left = Math.ceil(n.cadenceDays - el);
  let color="#30D158", st="fresh";
  if(frac>=1){ color="#FF453A"; st="overdue"; }
  else if(frac>=0.75){ color="#FFD60A"; st="soon"; }
  return {frac, left, color, state:st, elapsed:Math.floor(el)};
}

/* ============================================================
   CANVAS + CAMERA
============================================================ */
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
let cam = { x:0, y:0, scale:1 };

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  requestFrame();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=>setTimeout(resize,200));

const toScreenX = wx => (wx - cam.x)*cam.scale + W/2;
const toScreenY = wy => (wy - cam.y)*cam.scale + H/2;
const toWorldX  = sx => (sx - W/2)/cam.scale + cam.x;
const toWorldY  = sy => (sy - H/2)/cam.scale + cam.y;

/* ============================================================
   FORCE SIMULATION
============================================================ */
let simAlpha = 0;
const SIM_MIN = 0.008;
function kick(a=0.75){ simAlpha=Math.max(simAlpha,a); ensureLoop(); }

function stepSim(){
  const all = allNodes();
  const n = all.length;
  // seed positions for freshly added nodes
  for(const p of all){
    if(p.x==null||p.y==null){
      const par = byId(p.parentId) || ME;
      const ang = Math.random()*Math.PI*2;
      p.x = (par.x||0) + Math.cos(ang)*(par._r+p._r+40);
      p.y = (par.y||0) + Math.sin(ang)*(par._r+p._r+40);
      p.vx=0; p.vy=0;
    }
  }
  // repulsion (O(n^2) — fine for personal scale)
  for(let i=0;i<n;i++){
    const a=all[i];
    for(let j=i+1;j<n;j++){
      const b=all[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy; if(d2<0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d2=1; }
      const d=Math.sqrt(d2);
      const rep = (2600 + (a._r+b._r)*30) / d2;
      const fx=(dx/d)*rep, fy=(dy/d)*rep;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  // link springs (parent<->child)
  for(const c of all){
    if(c.parentId==null) continue;
    const p=byId(c.parentId); if(!p) continue;
    let dx=c.x-p.x, dy=c.y-p.y; let d=Math.hypot(dx,dy)||0.01;
    const rest = p._r + c._r + 46 + (c.type==="place"?24:0);
    const f = (d-rest)*0.035;
    const fx=(dx/d)*f, fy=(dy/d)*f;
    c.vx-=fx; c.vy-=fy; p.vx+=fx; p.vy+=fy;
  }
  // collision (prevent overlap)
  for(let i=0;i<n;i++){
    const a=all[i];
    for(let j=i+1;j<n;j++){
      const b=all[j];
      const dx=a.x-b.x, dy=a.y-b.y; const d=Math.hypot(dx,dy)||0.01;
      const min=a._r+b._r+10;
      if(d<min){ const push=(min-d)*0.5; const fx=(dx/d)*push, fy=(dy/d)*push; a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy; }
    }
  }
  // gentle centering
  for(const p of all){ p.vx += (0-p.x)*0.0016; p.vy += (0-p.y)*0.0016; }
  // integrate
  for(const p of all){
    if(p===ME){ p.x=0; p.y=0; p.vx=0; p.vy=0; continue; }
    if(p._drag){ p.vx=0; p.vy=0; continue; }
    p.vx*=0.82; p.vy*=0.82;
    const sp=Math.hypot(p.vx,p.vy); const MX=18; if(sp>MX){ p.vx=p.vx/sp*MX; p.vy=p.vy/sp*MX; }
    p.x += p.vx*simAlpha*1.4; p.y += p.vy*simAlpha*1.4;
  }
}

/* ============================================================
   RENDER
============================================================ */
let rafId=null, interacting=false, selectedId=null, focusPulse=0;
function ensureLoop(){ if(rafId==null) rafId=requestAnimationFrame(frame); }
function requestFrame(){ ensureLoop(); }
function frame(){
  rafId=null;
  let active=false;
  if(simAlpha>SIM_MIN){ stepSim(); simAlpha*=0.985; active=true; }
  if(focusPulse>0){ focusPulse-=0.04; active=true; }
  render();
  if(active||interacting) ensureLoop();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // subtle vignette background
  const g=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,"#0b0d16"); g.addColorStop(1,"#000");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const all = allNodes();
  // ---- links ----
  ctx.lineWidth = Math.max(0.6, 1*cam.scale);
  for(const c of all){
    if(c.parentId==null) continue;
    const p=byId(c.parentId); if(!p||p.x==null||c.x==null) continue;
    const col = nodeColor(c.type==="place"?c:p);
    ctx.strokeStyle = hexA(nodeColor(c), 0.22);
    ctx.beginPath();
    ctx.moveTo(toScreenX(p.x),toScreenY(p.y));
    ctx.lineTo(toScreenX(c.x),toScreenY(c.y));
    ctx.stroke();
  }
  // introduced-by (dashed)
  ctx.setLineDash([2,5]);
  ctx.strokeStyle="rgba(255,255,255,0.20)";
  for(const c of state.nodes){
    if(!c.introducedById) continue;
    const p=byId(c.introducedById); if(!p||p.x==null) continue;
    ctx.beginPath(); ctx.moveTo(toScreenX(p.x),toScreenY(p.y)); ctx.lineTo(toScreenX(c.x),toScreenY(c.y)); ctx.stroke();
  }
  ctx.setLineDash([]);

  // ---- nodes ----
  for(const nnode of all){
    if(nnode.x==null) continue;
    drawNode(nnode);
  }
}
function hexA(hex,a){
  const h=hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function drawNode(n){
  const sx=toScreenX(n.x), sy=toScreenY(n.y), r=n._r*cam.scale;
  if(sx< -r-60||sx>W+r+60||sy<-r-60||sy>H+r+60) return; // cull
  const col = nodeColor(n);
  const isMe = n.type==="me", isPlace=n.type==="place";

  // glow
  ctx.shadowColor = hexA(col, 0.5); ctx.shadowBlur = Math.min(30, r*0.7);
  // body
  const grad=ctx.createRadialGradient(sx-r*0.3,sy-r*0.35,r*0.1, sx,sy,r);
  grad.addColorStop(0, isMe?"#ffffff":col);
  grad.addColorStop(1, isMe?"#c7c7cc":shade(col,-0.34));
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  ctx.shadowBlur=0;
  // rim
  ctx.lineWidth=Math.max(0.5,0.8*cam.scale); ctx.strokeStyle="rgba(255,255,255,0.25)"; ctx.stroke();

  // contact status ring (people)
  if(n.type==="person"){
    const cs=contactStatus(n);
    if(cs){
      const rr=r+4;
      ctx.lineWidth=Math.max(1.5,2.4*cam.scale);
      ctx.strokeStyle=hexA(cs.color,0.28);
      ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle=cs.color;
      ctx.beginPath(); ctx.arc(sx,sy,rr,-Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(cs.frac,1)); ctx.stroke();
    }
  }
  // birthday marker
  if(n.type==="person" && n.birthday){
    const du=daysUntilBirthday(n.birthday);
    if(du!=null && du<=14){
      const bx=sx+r*0.72, by=sy-r*0.72;
      ctx.beginPath(); ctx.arc(bx,by,Math.max(5,6*cam.scale),0,Math.PI*2);
      ctx.fillStyle=du===0?"#FFD60A":"#FF9F0A"; ctx.shadowColor="#FFD60A"; ctx.shadowBlur=du===0?14:6; ctx.fill(); ctx.shadowBlur=0;
    }
  }
  // selection ring
  if(n.id===selectedId){
    ctx.lineWidth=2.5; ctx.strokeStyle="#fff";
    ctx.beginPath(); ctx.arc(sx,sy,r+9+focusPulse*10,0,Math.PI*2); ctx.stroke();
  }

  // icon / initials inside big enough bubbles
  if(r>14){
    ctx.fillStyle= isMe? "#000" : "rgba(255,255,255,0.95)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if(isPlace){
      ctx.font=`${Math.round(r*0.9)}px ${FS}`;
      ctx.fillText(n.emoji||"📍", sx, sy+r*0.04);
    }else if(isMe){
      ctx.font=`700 ${Math.round(r*0.5)}px ${FS}`;
      ctx.fillText(initials(n.name), sx, sy);
    }else{
      if(n.emoji){ ctx.font=`${Math.round(r*0.85)}px ${FS}`; ctx.fillText(n.emoji,sx,sy+r*0.04); }
      else { ctx.font=`700 ${Math.round(r*0.6)}px ${FS}`; ctx.fillText(initials(n.name),sx,sy); }
    }
  }
  // label (LOD: only when the bubble is reasonably large on screen)
  const screenR=r;
  if(screenR>13 || isPlace || isMe){
    const label = isPlace? n.name : firstName(n.name);
    ctx.font=`${isPlace?"700":"600"} ${clamp(Math.round(11*Math.min(cam.scale,1.3)),10,15)}px ${FS}`;
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillStyle= isPlace? "#E7D3FA" : "rgba(255,255,255,0.92)";
    ctx.shadowColor="rgba(0,0,0,0.85)"; ctx.shadowBlur=5;
    ctx.fillText(label, sx, sy+r+5);
    ctx.shadowBlur=0;
  }
}
function initials(name){ const p=(name||"").trim().split(/\s+/); return ((p[0]?.[0]||"")+(p[1]?.[0]||"")).toUpperCase()||"?"; }
function firstName(name){ return (name||"").trim().split(/\s+/)[0]||""; }

/* ============================================================
   HIT TESTING + GESTURES
============================================================ */
function nodeAt(sx,sy){
  const all=allNodes();
  for(let i=all.length-1;i>=0;i--){
    const n=all[i]; if(n.x==null) continue;
    const dx=sx-toScreenX(n.x), dy=sy-toScreenY(n.y);
    if(dx*dx+dy*dy <= Math.pow(n._r*cam.scale+8,2)) return n;
  }
  return null;
}

let ptrs=new Map(); // active pointers
let gesture=null;   // {mode, ...}
const TAP_MOVE=8, TAP_TIME=350;

function onDown(e){
  canvas.setPointerCapture?.(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:Date.now()});
  interacting=true; hideHint();
  if(ptrs.size===1){
    const hit=nodeAt(e.clientX,e.clientY);
    if(hit && hit.type!=="me"){
      gesture={mode:"node",node:hit,moved:false,x0:e.clientX,y0:e.clientY,t:Date.now()};
    }else if(hit && hit.type==="me"){
      gesture={mode:"maybeMe",node:hit,moved:false,x0:e.clientX,y0:e.clientY,t:Date.now()};
    }else{
      gesture={mode:"pan",moved:false,x0:e.clientX,y0:e.clientY,t:Date.now()};
    }
  }else if(ptrs.size===2){
    const p=[...ptrs.values()];
    gesture={mode:"pinch",d0:dist(p[0],p[1]),s0:cam.scale,
             mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,
             wx:toWorldX((p[0].x+p[1].x)/2),wy:toWorldY((p[0].y+p[1].y)/2)};
  }
  ensureLoop();
}
function onMove(e){
  const rec=ptrs.get(e.pointerId); if(!rec) return;
  rec.x=e.clientX; rec.y=e.clientY;
  if(!gesture) return;
  if(gesture.mode==="pinch" && ptrs.size>=2){
    const p=[...ptrs.values()];
    const d=dist(p[0],p[1]);
    const mx=(p[0].x+p[1].x)/2, my=(p[0].y+p[1].y)/2;
    let ns=clamp(gesture.s0 * (d/gesture.d0), 0.12, 5);
    cam.scale=ns;
    // keep the initial pinch world-point under the current midpoint
    cam.x = gesture.wx - (mx - W/2)/cam.scale;
    cam.y = gesture.wy - (my - H/2)/cam.scale;
    requestFrame(); return;
  }
  const dx=e.clientX-gesture.x0, dy=e.clientY-gesture.y0;
  if(!gesture.moved && Math.hypot(dx,dy)>TAP_MOVE) gesture.moved=true;

  if(gesture.mode==="node"){
    if(gesture.moved){
      gesture.node._drag=true;
      gesture.node.x=toWorldX(e.clientX); gesture.node.y=toWorldY(e.clientY);
      gesture.node.vx=0; gesture.node.vy=0; kick(0.5);
    }
  }else if(gesture.mode==="maybeMe" || gesture.mode==="pan"){
    if(gesture.moved){
      cam.x -= (e.clientX-rec_prevX(e))/cam.scale;
      cam.y -= (e.clientY-rec_prevY(e))/cam.scale;
      requestFrame();
    }
  }
}
// track previous position per move for smooth pan
let _prev={};
function rec_prevX(e){ const v=_prev[e.pointerId]?.x ?? e.clientX; _prev[e.pointerId]={x:e.clientX,y:_prev[e.pointerId]?.y ?? e.clientY}; return v; }
function rec_prevY(e){ const v=_prev[e.pointerId]?.y ?? e.clientY; _prev[e.pointerId]={x:_prev[e.pointerId]?.x ?? e.clientX,y:e.clientY}; return v; }

function onUp(e){
  const rec=ptrs.get(e.pointerId);
  delete _prev[e.pointerId];
  if(gesture && rec){
    const isTap = !gesture.moved && (Date.now()-gesture.t)<TAP_TIME;
    if(isTap && (gesture.mode==="node")){ openDetail(gesture.node); }
    else if(isTap && gesture.mode==="maybeMe"){ openMeSheet(); }
    if(gesture.mode==="node" && gesture.node){ gesture.node._drag=false; kick(0.35); save(); }
  }
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){ gesture=null; interacting=false; save(); }
  else if(ptrs.size===1){ // dropped to one finger -> resume pan
    const p=[...ptrs.entries()][0]; _prev[p[0]]={x:p[1].x,y:p[1].y};
    gesture={mode:"pan",moved:true,x0:p[1].x,y0:p[1].y,t:Date.now()};
  }
}
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

canvas.addEventListener("pointerdown",onDown);
canvas.addEventListener("pointermove",e=>{ // init prev on first move
  if(gesture && (gesture.mode==="pan"||gesture.mode==="maybeMe") && !_prev[e.pointerId]) _prev[e.pointerId]={x:e.clientX,y:e.clientY};
  onMove(e);
});
canvas.addEventListener("pointerup",onUp);
canvas.addEventListener("pointercancel",onUp);
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0015);
  zoomAt(e.clientX,e.clientY, clamp(cam.scale*f,0.12,5));
},{passive:false});
// double-tap / double-click to zoom in
let lastTap=0;
canvas.addEventListener("pointerup",e=>{
  const now=Date.now();
  if(now-lastTap<300 && !nodeAt(e.clientX,e.clientY)){ zoomAt(e.clientX,e.clientY,clamp(cam.scale*1.8,0.12,5)); }
  lastTap=now;
});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{ if(e.target===canvas) e.preventDefault(); },{passive:false});

function zoomAt(sx,sy,ns){
  const wx=toWorldX(sx), wy=toWorldY(sy);
  cam.scale=ns; cam.x=wx-(sx-W/2)/cam.scale; cam.y=wy-(sy-H/2)/cam.scale;
  requestFrame(); save();
}
function focusNode(n){
  const ns=clamp(1.5, 0.12,5);
  animateCam(n.x, n.y, ns); selectedId=n.id; focusPulse=1; ensureLoop();
}
function fitAll(){
  const all=allNodes().filter(n=>n.x!=null);
  if(all.length<=1){ animateCam(0,0,1); return; }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const n of all){ minX=Math.min(minX,n.x-n._r);maxX=Math.max(maxX,n.x+n._r);minY=Math.min(minY,n.y-n._r);maxY=Math.max(maxY,n.y+n._r); }
  const w=maxX-minX, h=maxY-minY;
  const s=clamp(Math.min((W-80)/w,(H-220)/h),0.12,2.2);
  animateCam((minX+maxX)/2,(minY+maxY)/2,s);
}
function animateCam(tx,ty,ts){
  const sx=cam.x,sy=cam.y,ss=cam.scale; const t0=performance.now(), dur=520;
  function tick(now){
    const k=clamp((now-t0)/dur,0,1); const e=1-Math.pow(1-k,3);
    cam.x=sx+(tx-sx)*e; cam.y=sy+(ty-sy)*e; cam.scale=ss+(ts-ss)*e;
    render();
    if(k<1) requestAnimationFrame(tick); else save();
  }
  requestAnimationFrame(tick);
}

   SHEETS / UI
============================================================ */
const scrim=document.getElementById("scrim");
const sheet=document.getElementById("sheet");
let sheetOpen=false;
function openSheet(html){
  sheet.innerHTML='<div class="grab"></div>'+html;
  scrim.classList.add("on"); sheet.classList.add("on"); sheetOpen=true;
}
function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); sheetOpen=false; }
scrim.addEventListener("click",closeSheet);

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800);
}
function haptic(ms=12){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---- social link building ---- */
function socialHref(kind,val){
  if(!val) return null; const v=val.trim();
  if(/^https?:\/\//i.test(v)) return v;
  switch(kind){
    case "instagram": return "https://instagram.com/"+v.replace(/^@/,"");
    case "linkedin": return "https://www.linkedin.com/in/"+encodeURIComponent(v.replace(/^@/,""));
    case "x": return "https://x.com/"+v.replace(/^@/,"");
    case "whatsapp": return "https://wa.me/"+v.replace(/[^0-9]/g,"");
    case "email": return "mailto:"+v;
    case "phone": return "tel:"+v.replace(/[^0-9+]/g,"");
    default: return v;
  }
}
const SOCIAL_META={
  instagram:{i:"IG",ph:"@handle or URL"},
  whatsapp:{i:"WA",ph:"phone number"},
  linkedin:{i:"in",ph:"profile URL or handle"},
  x:{i:"X",ph:"@handle or URL"},
  email:{i:"@",ph:"email address"},
  phone:{i:"☎",ph:"phone number"},
};
function bestReach(n){
  const s=n.socials||{};
  for(const k of ["whatsapp","instagram","phone","email","linkedin","x"]) if(s[k]) return {k,href:socialHref(k,s[k])};
  return null;
}

/* ---------- DETAIL ---------- */
function openDetail(n){
  selectedId=n.id; requestFrame();
  if(n.type==="place") return openPlaceDetail(n);
  const cs=contactStatus(n);
  const du = n.birthday? daysUntilBirthday(n.birthday):null;
  const s=n.socials||{};
  const links=Object.keys(SOCIAL_META).filter(k=>s[k]).map(k=>{

/* ---------- parent selector options ---------- */
function parentOptions(selected,excludeId){
  const opts=[`<option value="me" ${selected==="me"?"selected":""}>${esc(ME.name)} (you)</option>`];
  state.nodes.forEach(n=>{
    if(n.id===excludeId) return;
    const pfx=n.type==="place"?"📍 ":"";
    opts.push(`<option value="${n.id}" ${selected===n.id?"selected":""}>${pfx}${esc(n.name)}</option>`);
  });
  return opts.join("");
}

/* ---------- REMINDERS ---------- */
function computeReminders(){
  const people=state.nodes.filter(n=>n.type==="person");
  const todayB=[], soonB=[], overdue=[];
  people.forEach(p=>{
    if(p.birthday){ const du=daysUntilBirthday(p.birthday); if(du===0) todayB.push(p); else if(du>0&&du<=30) soonB.push({p,du}); }
    const cs=contactStatus(p); if(cs&&cs.state==="overdue") overdue.push({p,over:Math.abs(cs.left)});
  });
  soonB.sort((a,b)=>a.du-b.du); overdue.sort((a,b)=>b.over-a.over);
  return {todayB,soonB,overdue};
}
function openReminders(){
  const {todayB,soonB,overdue}=computeReminders();
  const row=(p,ds,dotc,ic,extra="")=>`
    <div class="rem-item" data-id="${p.id}">
      <div class="dot" style="background:${hexA(nodeColor(p),0.22)};color:${nodeColor(p)}">${ic}</div>
      <div style="flex:1"><div class="nm">${esc(p.name)}</div><div class="ds">${ds}</div></div>
      ${extra}<div class="go">&#8250;</div>
    </div>`;
  let body="";
  if(todayB.length){ body+=`<div class="seg-title">🎂 Birthdays today</div>`+todayB.map(p=>{
    const rr=bestReach(p); const btn=rr?`<a class="chip" style="flex:0 0 auto;color:#fff;text-decoration:none;padding:8px 12px" href="${esc(rr.href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Message</a>`:"";
    return row(p, "Turning "+(turningAge(p.birthday)||"?"), "#FFD60A","🎂",btn);
  }).join(""); }
  if(overdue.length){ body+=`<div class="seg-title" style="color:var(--red)">Overdue to reconnect</div>`+overdue.map(o=>{
    const rr=bestReach(o.p); const btn=rr?`<a class="chip" style="flex:0 0 auto;color:#fff;text-decoration:none;padding:8px 12px" href="${esc(rr.href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Reach</a>`:"";
    return row(o.p, `${o.over} day${o.over===1?"":"s"} overdue`, "#FF453A","⏰",btn);
  }).join(""); }
  if(soonB.length){ body+=`<div class="seg-title">Upcoming birthdays</div>`+soonB.map(s=>row(s.p, `in ${s.du} day${s.du===1?"":"s"} &middot; ${new Date(s.p.birthday).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`,"#FF9F0A","🎈")).join(""); }
  if(!body) body=`<div style="text-align:center;color:var(--txt2);padding:40px 10px">You're all caught up.<br/>Set birthdays and check-in rhythms to get nudges here.</div>`;

  const notifBtn = ("Notification" in window && Notification.permission!=="granted")
    ? `<button class="btn ghost" id="rNotif">Enable phone notifications</button>` : "";
  openSheet(`<div class="sh-title">Reminders</div><div class="sh-sub">Birthdays & people to reconnect with</div>${body}${notifBtn}`);
  sheet.querySelectorAll(".rem-item").forEach(it=>it.onclick=()=>{ const n=byId(it.dataset.id); if(n){ closeSheet(); focusNode(n); setTimeout(()=>openDetail(n),560); } });
  const nb=document.getElementById("rNotif"); if(nb) nb.onclick=async()=>{ try{ const p=await Notification.requestPermission(); if(p==="granted"){ toast("Notifications on"); runNotify(true);} }catch(e){} openReminders(); };
}

  openSheet(`<div class="sh-title">Find</div><input id="sq" placeholder="Search people and places" autocomplete="off" style="margin-top:12px"/><div id="sres" style="margin-top:10px">${render("")}</div>`);

function normNodes(s){ if(Array.isArray(s)) return s; if(s&&Array.isArray(s.nodes)) return s.nodes; return null; }

    if(s&&s.userName){ state.userName=s.userName; ME.name=s.userName; }
    if(s&&s.me&&s.me.name){ ME.name=s.me.name; state.userName=ME.name; }
  }else{
    const idMap={}; incoming.forEach(n=>{ idMap[n.id]=uid(); });
    incoming.forEach(n=>{
      const c=Object.assign({},n,{id:idMap[n.id],x:null,y:null});
      c.parentId = (n.parentId && n.parentId!=="me" && idMap[n.parentId]) ? idMap[n.parentId] : "me";
      c.introducedById = (n.introducedById && idMap[n.introducedById]) ? idMap[n.introducedById] : null;
      state.nodes.push(c);
    });
  }

  toast(mode==="merge"?"Merged in":"Restored");

/* ============================================================
   PATHS + BACKUP REPAIR (full-path portability)
============================================================ */
function pathOf(n){
  const out=[]; let cur=byId(n.parentId); let g=0;
  while(cur && cur.id!=="me" && g++<60){ out.unshift({name:cur.name,type:cur.type}); cur=byId(cur.parentId); }
  return out;
}
function pathString(n){
  const names=[]; let cur=byId(n.parentId); let g=0;
  while(cur && cur.id!=="me" && g++<60){ names.unshift(cur.name); cur=byId(cur.parentId); }
  return names.length? names.join(" › ") : "Direct";
}
function ensurePath(pathArr){
  let parent="me";
  for(const step of (pathArr||[])){
    let found=state.nodes.find(n=>n.name===step.name && n.type===step.type && n.parentId===parent);
    if(!found){ found={id:uid(),type:step.type,name:step.name,parentId:parent,x:null,y:null};
      if(step.type==="person"){ found.category="friend"; found.closeness=5; found.socials={}; found.cadenceDays=0; }
      state.nodes.push(found); }
    parent=found.id;
  }
  return parent;
}
function repairParents(){
  // any node whose parent id is missing gets rebuilt from its stored path
  state.nodes.forEach(n=>{
    if(n.parentId && n.parentId!=="me" && !byId(n.parentId)){
      n.parentId = (Array.isArray(n.path)&&n.path.length)? ensurePath(n.path) : "me";
    }
  });
  state.nodes.forEach(n=>{ delete n.path; });
}

function urgencyScore(p){
  let s=0; const cs=contactStatus(p);
  if(cs){ if(cs.state==="overdue") s+=1000+Math.min(Math.abs(cs.left),365); else if(cs.state==="soon") s+=350; }
  if(p.birthday){ const du=daysUntilBirthday(p.birthday); if(du!=null&&du<=14) s+=800-du*12; }
  // slow decay: close people you haven't logged nudge upward
  if(!cs && (p.closeness||0)>=7) s+=120;
  s += (p.closeness||0);
  return s;
}

/* ============================================================
   CALENDAR EXPORT (.ics)
============================================================ */
function pad2(x){ return String(x).padStart(2,"0"); }
function icsEsc(t){ return (t||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }
function buildICS(){
  const now=new Date();
  const stamp=now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+"T"+pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+pad2(now.getUTCSeconds())+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Orbit//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Orbit"];
  state.nodes.filter(n=>n.type==="person").forEach(p=>{
    if(p.birthday){ const b=parseYMD(p.birthday); if(b){
      L.push("BEGIN:VEVENT","UID:orbit-bday-"+p.id+"@orbit","DTSTAMP:"+stamp,
        "DTSTART;VALUE=DATE:"+b.y+pad2(b.m)+pad2(b.d),"RRULE:FREQ=YEARLY",
        "SUMMARY:🎂 "+icsEsc(p.name)+"'s birthday",
        "BEGIN:VALARM","TRIGGER:-PT9H","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(p.name+"'s birthday"),"END:VALARM","END:VEVENT");
    }}
    if(p.cadenceDays && p.lastContact){
      const nx=new Date(p.lastContact + p.cadenceDays*DAY);
      L.push("BEGIN:VEVENT","UID:orbit-checkin-"+p.id+"@orbit","DTSTAMP:"+stamp,
        "DTSTART;VALUE=DATE:"+nx.getFullYear()+pad2(nx.getMonth()+1)+pad2(nx.getDate()),
        "RRULE:FREQ=DAILY;INTERVAL="+p.cadenceDays,
        "SUMMARY:📞 Check in with "+icsEsc(p.name),
        "BEGIN:VALARM","TRIGGER:PT9H","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("Reconnect with "+p.name),"END:VALARM","END:VEVENT");
    }
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function exportICS(){
  try{
    const blob=new Blob([buildICS()],{type:"text/calendar"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="orbit-reminders.ics"; document.body.appendChild(a); a.click(); a.remove();
    toast("Calendar file created — open it to add");
  }catch(e){ toast("Couldn't create calendar file"); }
}

/* ============================================================
   CLOUD SYNC (private GitHub Gist)
============================================================ */
const GIST_KEY="orbit.gist";
let syncTimer=null;
function gistCfg(){ try{ return JSON.parse(localStorage.getItem(GIST_KEY)||"null"); }catch(e){ return null; } }
function setGistCfg(c){ try{ if(!c) localStorage.removeItem(GIST_KEY); else localStorage.setItem(GIST_KEY,JSON.stringify(c)); }catch(e){} }
function syncSoon(){
  const c=gistCfg(); if(!c||!c.token) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ gistPush().catch(()=>{}); }, 3500);
}
async function gistPush(){
  const c=gistCfg(); if(!c||!c.token) return {ok:false,err:"no token"};
  const body={description:"Orbit backup "+new Date().toISOString(),public:false,files:{"orbit.json":{content:backupJSON()}}};
  const url=c.id?("https://api.github.com/gists/"+c.id):"https://api.github.com/gists";
  const res=await fetch(url,{method:c.id?"PATCH":"POST",
    headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!res.ok) return {ok:false,err:"HTTP "+res.status};
  const j=await res.json(); if(!c.id && j.id){ c.id=j.id; setGistCfg(c); }
  return {ok:true};
}
async function gistPull(){
  const c=gistCfg(); if(!c||!c.token||!c.id) return {ok:false,err:"not set up"};
  const res=await fetch("https://api.github.com/gists/"+c.id,
    {headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json"}});
  if(!res.ok) return {ok:false,err:"HTTP "+res.status};
  const j=await res.json(); const f=j.files&&j.files["orbit.json"]; if(!f) return {ok:false,err:"no data"};
  let content=f.content;
  if(f.truncated && f.raw_url){ const r2=await fetch(f.raw_url); content=await r2.text(); }
  return {ok:true,data:JSON.parse(content)};
}
async function cloudBootSync(){
  const c=gistCfg(); if(!c||!c.token||!c.id) return;
  try{
    const r=await gistPull();
    if(r.ok && r.data){
      const cloudExp=r.data.exported? Date.parse(r.data.exported):0;
      const localExp=+(localStorage.getItem("orbit.lastlocal")||0);
      if(state.nodes.length===0 || cloudExp>localExp+2000){ applyBackup(r.data,"replace"); toast("Synced from cloud"); }
    }
  }catch(e){}
}

/* ============================================================
   CONTACTS IMPORT (vCard)
============================================================ */
function parseVCard(text){
  const unfolded=(text||"").replace(/\r?\n[ \t]/g,""); // RFC line unfolding
  const blocks=unfolded.split(/BEGIN:VCARD/i).slice(1);
  const cards=[];
  blocks.forEach(b=>{
    const c={socials:{}};
    b.split(/\r?\n/).forEach(line=>{
      const up=line.toUpperCase(); const val=line.slice(line.indexOf(":")+1).trim();
      if(up.startsWith("FN:")) c.name=val;
      else if(up.startsWith("N:") && !c.name){ const p=val.split(";"); c.name=((p[1]||"")+" "+(p[0]||"")).trim(); }
      else if(up.startsWith("BDAY")){ const m=val.match(/(\d{4})-?(\d{2})-?(\d{2})/); if(m) c.birthday=m[1]+"-"+m[2]+"-"+m[3]; }
      else if(up.startsWith("TEL")){ if(val && !c.socials.phone) c.socials.phone=val; }
      else if(up.startsWith("EMAIL")){ if(val && !c.socials.email) c.socials.email=val; }
      else if(up.startsWith("URL")){ if(/instagram/i.test(val)) c.socials.instagram=val; else if(/linkedin/i.test(val)) c.socials.linkedin=val; }
    });
    if(c.name) cards.push(c);
  });
  return cards;
}
function importVCF(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const cards=parseVCard(rd.result); if(!cards.length){ toast("No contacts found in that file"); return; } confirmImportContacts(cards); };
  rd.readAsText(f);
}
function confirmImportContacts(cards){

      ${cards.length>60?`<div style="color:var(--txt2);padding:8px 2px">…and ${cards.length-60} more</div>`:""}
    </div>
    <button class="btn primary" id="ciYes">Add ${cards.length} people</button>
    <button class="btn ghost" id="ciNo">Cancel</button>`);
  document.getElementById("ciNo").onclick=openMenu;
  document.getElementById("ciYes").onclick=()=>{
    cards.forEach(c=>state.nodes.push({id:uid(),type:"person",name:c.name,parentId:"me",category:"friend",color:CAT.friend.c,closeness:5,cadenceDays:0,lastContact:null,birthday:c.birthday||"",emoji:"",socials:c.socials||{},notes:"",introducedById:null,x:null,y:null}));
    rebuild(); save(); kick(1); refreshChrome(); closeSheet(); setTimeout(fitAll,400); toast("Added "+cards.length+" people");
  };
}

  }

  const c=aiCfg()||{provider:"anthropic",model:"",key:""};

    <div class="sh-sub">Uses <b>your own</b> API key, called straight from your phone. The key is stored only on this device.</div>
    <label class="fl">Provider</label>
    <div class="chips"><div class="chip aiProv ${c.provider!=="openai"?"on":""}" data-p="anthropic" style="color:#fff">Anthropic</div><div class="chip aiProv ${c.provider==="openai"?"on":""}" data-p="openai" style="color:#fff">OpenAI</div></div>
    <label class="fl">API key</label>
    <input id="aiKey" value="${esc(c.key||"")}" placeholder="paste your key" autocomplete="off"/>
    <label class="fl">Model (optional)</label>
    <input id="aiModel" value="${esc(c.model||"")}" placeholder="leave blank for a fast default" autocomplete="off"/>
    <button class="btn primary" id="aiSave">Save</button>
    <div style="font-size:11px;color:var(--txt3);margin-top:10px;line-height:1.5">Keys: console.anthropic.com or platform.openai.com. If a default model errors, paste a current model name here.</div>`);
  let prov=c.provider||"anthropic";
  sheet.querySelectorAll(".aiProv").forEach(x=>x.onclick=()=>{ prov=x.dataset.p; sheet.querySelectorAll(".aiProv").forEach(y=>y.classList.remove("on")); x.classList.add("on"); });
  document.getElementById("aiSave").onclick=()=>{ setAICfg({provider:prov,key:document.getElementById("aiKey").value.trim(),model:document.getElementById("aiModel").value.trim()}); toast(aiReady()?"AI copilot ready":"Saved"); closeSheet(); };
}
function openDraft(n){
  if(!aiReady()) return openAISetup();
  openSheet(`<div class="sh-title">Draft a message</div><div class="sh-sub">to ${esc(n.name)}</div>
    <div class="chips" style="margin-top:12px">
      <div class="chip aiIntent on" data-i="reconnect" style="color:#fff">Reconnect</div>
      <div class="chip aiIntent" data-i="birthday" style="color:#fff">Birthday</div>
      <div class="chip aiIntent" data-i="checkin" style="color:#fff">Quick hello</div>
    </div>
    <textarea id="aiExtra" placeholder="Anything specific to include? (optional)" style="min-height:60px;margin-top:10px"></textarea>
    <button class="btn primary" id="aiGo">✨ Generate</button>
    <div id="aiOut"></div>`);
  let intent="reconnect";
  sheet.querySelectorAll(".aiIntent").forEach(c=>c.onclick=()=>{ intent=c.dataset.i; sheet.querySelectorAll(".aiIntent").forEach(x=>x.classList.remove("on")); c.classList.add("on"); });
  document.getElementById("aiGo").onclick=async()=>{
    const out=document.getElementById("aiOut"); out.innerHTML='<div style="color:var(--txt2);padding:14px 0">Thinking…</div>';
    const extra=document.getElementById("aiExtra").value.trim();
    const sys="You help write a short, warm, natural personal message (2-4 sentences) the user can send as themselves. Friendly peer tone, not corporate. No hashtags. Output ONLY the message text, nothing else.";
    const usr=`Intent: ${intent}.\nPerson:\n${personContext(n)}\n${extra?("Also include: "+extra):""}`;
    try{
      const txt=await aiChat(sys,usr); const rr=bestReach(n);
      out.innerHTML=`<textarea id="aiMsg" style="min-height:120px;margin-top:12px">${esc(txt)}</textarea>
        <button class="btn primary" id="aiCopy">Copy</button>
        ${rr?`<a class="btn green" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${esc(rr.href)}" target="_blank" rel="noopener">Open ${rr.k} to send</a>`:""}`;
      document.getElementById("aiCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(document.getElementById("aiMsg").value); toast("Copied"); }catch(e){ toast("Select & copy manually"); } };
    }catch(e){ out.innerHTML='<div style="color:#FF453A;padding:12px 0">AI error: '+esc(e.message)+'. Check your key/model in the menu.</div>'; }
  };
}
async function summarizePerson(n){
  if(!aiReady()) return openAISetup();
  openSheet(`<div class="sh-title">${esc(n.name)}</div><div id="aiOut" style="margin-top:14px;color:var(--txt2)">Thinking…</div>`);
  try{ const txt=await aiChat("In 2-3 sentences, summarize who this person is to the user and why they matter. Be concrete and warm.", personContext(n));
    document.getElementById("aiOut").innerHTML='<div style="font-size:14px;line-height:1.55;white-space:pre-wrap">'+esc(txt)+'</div>';
  }catch(e){ document.getElementById("aiOut").innerHTML='<span style="color:#FF453A">AI error: '+esc(e.message)+'</span>'; }
}
async function openOutreachPlan(){
  if(!aiReady()) return openAISetup();
  const {todayB,soonB,overdue}=computeReminders();
  const lines=[...overdue.map(o=>`${o.p.name} — overdue ${o.over}d, closeness ${o.p.closeness||"?"}${pathString(o.p)!=="Direct"?", via "+pathString(o.p):""}`),
    ...todayB.map(p=>`${p.name} — birthday today`),
    ...soonB.map(s=>`${s.p.name} — birthday in ${s.du}d`)];
  openSheet(`<div class="sh-title">This week's outreach</div><div id="aiOut" style="margin-top:14px;color:var(--txt2)">Thinking…</div>`);
  const out=document.getElementById("aiOut");
  if(!lines.length){ out.innerHTML="Nothing urgent — you're on top of it. ✨"; return; }
  try{ const txt=await aiChat("You are a sharp relationship coach. Given people the user should contact, produce a short prioritized plan: the top 3-5, one line each, each with a specific reason and a one-line suggested opener. Be concise and practical.", lines.join("\n"));
    out.innerHTML='<div style="font-size:14px;line-height:1.6;white-space:pre-wrap">'+esc(txt)+'</div>';
  }catch(e){ out.innerHTML='<span style="color:#FF453A">AI error: '+esc(e.message)+'</span>'; }
}
async function bioFill(){
  if(!aiReady()){ openAISetup(); return; }
  const ta=document.getElementById("bioText"); const raw=(ta&&ta.value||"").trim(); if(!raw){ toast("Paste a bio first"); return; }
  const btn=document.getElementById("bioGo"); if(btn) btn.textContent="Thinking…";
  try{
    let txt=await aiChat('Extract contact fields from the text. Reply with ONLY minified JSON, keys: name, city, birthday (YYYY-MM-DD or ""), instagram, linkedin, email, phone, notes. Use "" when unknown.', raw);
    txt=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
    const m=txt.match(/\{[\s\S]*\}/); const o=JSON.parse(m?m[0]:txt);
    const setV=(id,v)=>{ const el=document.getElementById(id); if(el&&v) el.value=v; };
    setV("fName",o.name); setV("fBday",o.birthday);
    const setSoc=(k,v)=>{ const el=sheet.querySelector('[data-soc="'+k+'"]'); if(el&&v) el.value=v; };
    setSoc("instagram",o.instagram); setSoc("linkedin",o.linkedin); setSoc("email",o.email); setSoc("phone",o.phone);
    const nt=document.getElementById("fNotes"); if(nt && o.notes) nt.value=o.notes;
    toast("Filled from bio — review & save");
  }catch(e){ toast("Couldn't parse that: "+e.message); }
  finally{ if(btn) btn.textContent="✨ Autofill from bio"; }
}

/* ============================================================
   CHROME (top bar stats + bell badge)
============================================================ */
function refreshChrome(){
  const ppl=state.nodes.filter(n=>n.type==="person").length;
  const plc=state.nodes.filter(n=>n.type==="place").length;
  const {todayB,overdue}=computeReminders();
  const od=overdue.length;
  document.getElementById("stats").innerHTML =
    `<span>${esc(ME.name)}'s network</span>`+
    (ppl?`<span>${ppl} ${ppl===1?"person":"people"}</span>`:"")+
    (plc?`<span>${plc} place${plc===1?"":"s"}</span>`:"")+
    (od?`<span class="od">${od} overdue</span>`:"");
  const badge=document.getElementById("bellBadge"); const c=todayB.length+od;
  if(c>0){ badge.textContent=c; badge.classList.remove("hidden"); } else badge.classList.add("hidden");
}

/* ============================================================
   NOTIFICATIONS (best-effort, while app is open)
============================================================ */
function runNotify(force){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const today=new Date().toDateString();
  if(!force && localStorage.getItem("orbit.notified")===today) return;
  localStorage.setItem("orbit.notified",today);
  const {todayB,overdue}=computeReminders();
  try{
    todayB.forEach(p=>new Notification("🎂 "+p.name+"'s birthday today",{body:"Send a message?",icon:ICON}));
    if(overdue.length) new Notification("Orbit",{body:`${overdue.length} ${overdue.length===1?"person":"people"} to reconnect with`,icon:ICON});
  }catch(e){}
}

/* ============================================================
   PWA install bits + wiring
============================================================ */
(function pwa(){
  const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=ICON; document.head.appendChild(al);
  try{
    const manifest={name:"Orbit",short_name:"Orbit",display:"standalone",background_color:"#000000",theme_color:"#000000",start_url:".",scope:".",icons:[{src:ICON,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const ml=document.createElement("link"); ml.rel="manifest";
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
    document.head.appendChild(ml);
  }catch(e){}
})();

document.getElementById("btnBell").onclick=openReminders;
document.getElementById("btnMenu").onclick=openMenu;

document.getElementById("btnZoomOut").onclick=()=>zoomAt(W/2,H/2,clamp(cam.scale/1.5,0.12,5));

/* ============================================================
   BOOT
============================================================ */
function showApp(){
  document.getElementById("boot").classList.add("hidden");
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("controls").classList.remove("hidden");
  const hint=document.getElementById("hint"); hint.classList.remove("hidden");
  refreshChrome(); rebuild(); kick(1);
  setTimeout(()=>{ if(state.cam){ cam=state.cam; } fitAll(); },100);
  setTimeout(()=>runNotify(false),1500);
  cloudBootSync();
}
let hintHidden=false;
function hideHint(){ if(hintHidden)return; hintHidden=true; const h=document.getElementById("hint"); h.style.opacity="0"; setTimeout(()=>h.classList.add("hidden"),700); }
setTimeout(hideHint,6000);

function boot(){
  load(); resize();
  // ask the browser to keep our storage (helps prevent eviction on iOS/Safari)
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(state.cam) cam=Object.assign({x:0,y:0,scale:1},state.cam);
  if(state.userName){ ME.name=state.userName; showApp(); }
  else{
    const inp=document.getElementById("nameInput"), btn=document.getElementById("startBtn");
    const go=()=>{ const v=inp.value.trim(); if(!v){inp.focus();return;} state.userName=v; ME.name=v; ME.x=0;ME.y=0; save(); showApp(); };
    btn.onclick=go; inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    setTimeout(()=>inp.focus(),400);
  }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ refreshChrome(); requestFrame(); } });
}
boot();
</script>
